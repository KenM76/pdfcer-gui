# pdfcer GUI rebuild — workspace root.
#
# Two members, and the split is load-bearing:
#
#   egui-shell  — a REUSABLE application shell (ribbon, dock, modes,
#                 layout persistence, theme, command registry). It knows
#                 nothing about PDF and must never learn. Enforced by
#                 tools/gates/check-shell-purity.sh. MIT, extracted to its
#                 own repository at or before fold-in.
#   pdfcer-gui   — the pdfcer application. Supplies a shell manifest, panel
#                 bodies and command handlers; depends on pdfcer-core and
#                 pdfcer-render by PATH into D:\Dev\pdfcer.
#
# The path dependencies are deliberate (PROJECT_PLAN.md §2): building
# against the live engine means divergence shows up at compile time rather
# than at fold-in. D:\Dev\pdfcer is READ-ONLY for this project.
[workspace]
resolver = "2"
members = [
    "crates/egui-shell",
    # native-clipboard — the ordered, all-or-nothing clipboard transaction.
    #
    # A SECOND `native-*` member rather than a module inside `native-window`,
    # and the split is by SUBJECT rather than by convenience: that crate is
    # about *windows*, its own docs say so ("There is no trait, no abstraction
    # … when the toolkit grows an owner option, this module is DELETED"), and
    # its `clipboard` module already opens by admitting it is "the first thing
    # in this crate that is not about a *window*". One more clipboard concern
    # in there would make the name a lie rather than a description.
    #
    # Both are here for the same structural reason and neither adds a
    # dependency: `pdfcer-gui` carries `#![forbid(unsafe_code)]`, `forbid`
    # cannot be relaxed from the inside, and Win32 clipboard placement is
    # `unsafe`. See `crates/native-clipboard/Cargo.toml` for the full argument
    # and for what must never go into it.
    "crates/native-clipboard",
    "crates/native-window",
    "crates/pdfcer-gui",
    "tools/ui-verify",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
egui-shell = { path = "crates/egui-shell" }

# Versions are pinned to match D:\Dev\pdfcer exactly. A dependency this
# workspace adds that is NOT already in pdfcer's lockfile is an operator
# decision, not a convenience — pdfcer's dependency posture (all-permissive
# licences, no GPL engines, skrifa pinned to epaint's) is deliberate.
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "wayland",
    "x11",
] }
egui = { version = "0.35", default-features = false }
egui_tiles = { version = "0.16.0", default-features = false }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
thiserror = "2"

[profile.release]
debug = 1

# ★★★ The DEBUG profile carries line tables only, not full debug info.
#
# Operator, 2026-08-27: *"all this compiling has filled the drive with temporary
# files."* He was right, and the debug profile was most of it: measured on
# 2026-08-27, a clean `cargo test --workspace` left **4.1 GB** in `target/debug`
# against 1.3 GB in `target/release`, and the single largest file on the disk
# was a **324 MB** `.pdb` for one crate. The rlibs carry the rest — 209 MB,
# 155 MB, 139 MB — and it is debug info in every case, not code.
#
# `line-tables-only` keeps the one thing this project actually reads from debug
# info: **a panic backtrace with file names and line numbers**, which is how
# every failing test in the suite reports itself. What it drops is the variable,
# type and lexical-scope information a step debugger wants — and nothing in this
# project's workflow steps through a debugger. R1's method is to drive the real
# binary and read a trace, and the trace is `PDFCER_DIAG`, not a watch window.
#
# ★ If somebody does need a full debugger session, `cargo test --profile dev
# --config profile.dev.debug=2` restores it for that run without the tree
# carrying the cost for every run in between.
#
# The RELEASE profile is untouched at `debug = 1`. That is what makes a stack
# trace from the shipped binary intelligible, it is already the minimum that
# does so, and the operator runs the release build.
[profile.dev]
debug = "line-tables-only"
