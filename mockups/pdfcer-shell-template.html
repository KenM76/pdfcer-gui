<title>pdfcer Shell — the A7 layout, as ruled in O123</title>
<!--
  ===================================================================
  pdfcer-shell-template.html — SOURCE for mockups/pdfcer-shell.html
  ===================================================================

  WHAT THIS IS. A mockup of the pdfcer GUI shell. It was drawn to support one
  scheduling decision — whether, and in what order, to build the four
  shell-layout proposals analysed in `SHELL_LAYOUT_PROPOSAL.md` — and on
  2026-09-04 THAT DECISION WAS MADE. `OPERATOR_REQUESTS.md` **O123** is the
  operator's ruling, in his own words, and this file now draws the layout he
  ruled for rather than the proposal it came from.

  ⇒ So the artifact's job changed with it. It is no longer "here are four
  options, ranked". It is *"here is the thing you decided, so you can check
  that it is the thing you meant"* — which is why every knob that flips it back
  to the arrangement before O123 has been kept and one more has been added.

  Two placeholders — {{SPRITE}} and {{GLYPHS}} — are filled by
  `build-pdfcer-shell.py`. Do not edit `pdfcer-shell.html` directly; edit this
  file and rebuild, or the next rebuild silently discards the edit.

  REBUILD:
      python mockups/extract-shipped-glyphs.py     # only if icons/assets moved
      python mockups/build-pdfcer-shell.py         # writes pdfcer-shell.html

  The generator inlines the glyph sprite, refuses to write when the template
  references art that does not exist, and then RENDERS the result headlessly
  and fails the build if three region markers did not draw. That last step is
  not ceremony: one unescaped apostrophe in one legend string throws a
  SyntaxError, the script never runs, and what lands on disk is a perfectly
  valid HTML file containing an empty window.

  ★★★ WHAT IT IS NOT. It is not the product, and it is not a specification.
  A mock that drifts from the product is how a deleted feature comes back as a
  picture of itself — which is not a hypothetical: the reviewer's original drew
  a `Thin lines` toggle for a command deleted six weeks earlier, and it took a
  deliberate re-read against the source to catch it (`GLYPH_ADOPTION.md`).
  Every divergence from the shipped build in this file is therefore STATED, in
  one line, in the legend drawer along the bottom of the mock — with its state:

      SHIPPED    it is in the build today; the mock is not proposing it
      RULED      the operator DECIDED it (O123). It is not a proposal any more
                 and it is not automatically built either — every RULED line
                 carries, in its reference row, whether the build has caught up
      PROPOSED   nobody has ruled on it; the line carries the rank and cost
      REJECTED   it was analysed and refused; the line carries the reason
      NOTED      neither, but the operator should see it

  ★★★ RULED IS A FIFTH STATE AND NOT A SYNONYM FOR EITHER NEIGHBOUR, and the
  reason is worth a paragraph because getting it wrong is the one way this
  artifact can lie to the person reading it.

    · Calling a ruled item PROPOSED understates it. It says a decision is still
      open that the operator has already closed, and invites him to re-decide
      something he decided — which is exactly the "do not re-argue a decided
      point" failure.
    · Calling it SHIPPED overstates it, and that is the worse of the two: a
      mock that draws a control as built is a mock somebody will schedule
      around. A ruling is an instruction to build. It is not a build.

  So the chip says whose decision it is, and the mono reference row under each
  line says where the code actually stands — `landed 2026-09-04` or
  `not started`. Both facts, neither inferred from the other.

  A silent difference is the defect. A stated one is the deliverable.

  HOW THE MOCK IS DRIVEN. All state lives in one `state` object and every
  surface is re-rendered from it. The controls that change it are in the
  "mock controls" bar at the bottom — deliberately NOT in the title bar, so
  that nothing in the window chrome above is a control the product lacks.

  COLOUR. The palette is the product's own, read from
  `crates/egui-shell/src/theme/mod.rs`, not invented: three presets (Quiet,
  Airy, Dark) with `accent` #175CC4 / #175CC4 / #4C9AFF and `selected_plate`
  #A9BEDF / #B9CEED / #0B1726. A selected chrome control is ACCENT INK on an
  OPAQUE PLATE — never white on a translucent wash, which was the D2 defect.

  ★ THE ONE INVARIANT A DARK THEME IN THIS PRODUCT MUST HOLD: the page stays
  white. `--paper` is #FFFFFF under every preset and is deliberately NOT
  redefined in any preset block. A dark board is a dark BENCH; the sheet on it
  is the document's own colour, and a PDF page is white. If a future edit ever
  makes `--paper` follow the theme, that edit is wrong.

  OFFLINE. The IBM Plex `<link>` is a progressive enhancement. Every font
  token carries a real fallback stack (system-ui / Segoe UI / Consolas), so the
  file reads correctly opened from disk with no network.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* ---------------------------------------------------------------------------
   Palette. Every value below is read from crates/egui-shell/src/theme/mod.rs.
   Roles, never colour names — `accent`, not `blue`.
   --------------------------------------------------------------------------- */
/* ★ `color-scheme` is set per preset because native form controls — the pen's
   font <select>, the size <input> — take their chrome from it and NOT from our
   background declaration. Without this line the dark board draws a light combo
   box in a dark panel, which is not a theming nicety: the mock's whole job on
   the dark board is to show that everything follows the preset except the
   page, and one light control in the middle of it says the opposite. */
:root, .app[data-board="quiet"]{
  color-scheme:light;
  --chrome:#F2F2F3;      /* Palette::surface  — the window ground            */
  --chrome-2:#E8E8EA;    /* Palette::panel    — panels, bars, docks          */
  --chrome-3:#DBDBDE;    /* hover, derived                                   */
  --bench:#6E7074;       /* Palette::content_backdrop — the board            */
  --ink:#1C1C1E;         /* Palette::text                                    */
  --ink-quiet:#5E6066;   /* Palette::text_muted                              */
  --line:#C4C6CA;        /* Palette::outline                                 */
  --line-strong:#A6A9AF; /* derived                                          */
  --accent:#175CC4;      /* Palette::accent                                  */
  --plate:#A9BEDF;       /* Palette::selected_plate — OPAQUE. accent is ink. */
  --warn:#B06A1A;        /* Palette::notice                                  */
  --danger:#C02A2A;      /* Palette::danger                                  */
}
.app[data-board="airy"]{
  color-scheme:light;
  --chrome:#FAFAFB; --chrome-2:#FFFFFF; --chrome-3:#EDEEF1; --bench:#8A8D93;
  --ink:#24262B; --ink-quiet:#6C7078; --line:#DCDEE3; --line-strong:#B9BCC4;
  --accent:#175CC4; --plate:#B9CEED; --warn:#B06A1A; --danger:#C02A2A;
}
.app[data-board="dark"]{
  color-scheme:dark;
  --chrome:#24262A; --chrome-2:#2E3136; --chrome-3:#3A3E45; --bench:#16171A;
  --ink:#E6E8EC; --ink-quiet:#9A9EA6; --line:#44484F; --line-strong:#5C6068;
  --accent:#4C9AFF; --plate:#0B1726; --warn:#E0A040; --danger:#FF6B6B;
}
/* ★ NOT inside any preset block, and that is the point. See the header. */
:root{
  --paper:#FFFFFF;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",Consolas,ui-monospace,monospace;
}

html,body{height:100%}
body{margin:0;background:#1A1B1E;font-family:var(--sans);font-size:13px;line-height:1.3;color:#1C1C1E;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;text-align:left}
svg.g{width:16px;height:16px;fill:none;stroke:currentColor;flex:none;display:block}
.g.big{width:24px;height:24px}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
kbd{font-family:var(--mono);font-size:.9em;border:1px solid var(--line-strong);border-radius:2px;padding:0 3px}
.indic{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-quiet);border:1px dashed var(--line-strong);border-radius:2px;padding:0 3px;vertical-align:1px}

/* --------------------------------------------------------------------------
   The window. Rows: titlebar · top strip · ribbon · doc tabs · body · status ·
   mock-control bar · legend drawer. The last two are NOT the product.
   -------------------------------------------------------------------------- */
.app{position:fixed;inset:0;display:grid;
     grid-template-rows:30px 34px 96px 26px minmax(0,1fr) 26px auto auto;
     background:var(--chrome);color:var(--ink);font-variant-numeric:tabular-nums;min-width:1100px}
.titlebar{display:flex;align-items:center;gap:10px;padding:0 4px 0 10px;background:var(--chrome-2);border-bottom:1px solid var(--line);font-size:12px}
.titlebar .name{flex:1}
.titlebar .name b{font-weight:500}
.titlebar .wc{display:flex}
.titlebar .wc span{width:40px;text-align:center;color:var(--ink-quiet)}

/* top strip: QAT · ribbon tabs · modes */
.top{display:flex;align-items:stretch;padding:0 8px;border-bottom:1px solid var(--line)}
.qat{display:flex;align-items:center;gap:2px;padding-right:10px;margin-right:6px;border-right:1px solid var(--line)}
.qat button{width:26px;height:26px;display:grid;place-items:center;border-radius:2px}
.qat button:hover{background:var(--chrome-3)}
.tabs{display:flex;align-items:stretch;gap:2px}
.tabs button{padding:0 10px;border-bottom:2px solid transparent;font-weight:500;color:var(--ink-quiet)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--plate)}
.tabs button.ctx{font-style:italic}
.modes{margin-left:auto;display:flex;align-self:center;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.modes button{padding:4px 12px;font-weight:500;color:var(--ink-quiet)}
.modes button+button{border-left:1px solid var(--line-strong)}
.modes button[aria-pressed="true"]{background:var(--plate);color:var(--accent)}

/* ribbon */
.ribbon{display:flex;align-items:stretch;gap:0;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow:hidden}
.grp{display:flex;flex-direction:column;padding:0 10px 0 6px;border-right:1px solid var(--line);position:relative}
.grp:last-child{border-right:0}
.grp .cap{font-size:11px;color:var(--ink-quiet);text-align:center;margin-top:auto;padding:3px 0 5px;line-height:1.1}
.grp .items{display:flex;gap:2px;align-items:flex-start}
.grp .col{display:flex;flex-direction:column;gap:1px}
/* The in-band rule — `Item::Separator`. Full height of the item row, one hair
   wide, in the ordinary line ink and not the strong one: it divides clusters
   INSIDE a band, and the band border beside it is the heavier statement. */
.grp .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.rb{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 4px;border-radius:2px;font-size:12px;white-space:nowrap;border:1px solid transparent;height:22px}
.rb:hover{background:var(--chrome-3)}
.rb[aria-pressed="true"]{background:var(--plate);color:var(--accent);border-color:var(--plate)}
.rb[disabled]{color:var(--ink-quiet);opacity:.45}
.rb.big{flex-direction:column;justify-content:flex-start;gap:4px;height:56px;padding:5px 8px 2px;min-width:52px}
.rb.big .lb{font-size:11px;line-height:1.1;text-align:center;white-space:normal;max-width:76px}
.rb .car{width:10px;height:10px;margin-left:-2px}
.app[data-labels="off"] .rb:not(.big) .lb{display:none}
.app[data-labels="off"] .rb:not(.big){padding:3px 4px}
/* ★ A ribbon control the mock draws that the BUILD does not have. Dashed, in
   the same notice colour as `.cell.proposed` in the dock, so "not built" reads
   one way everywhere in this artifact rather than two. Two shades because the
   two states are scheduled differently and the operator reads this to schedule:
   `soon` is not built and not being built; `building` is in flight on another
   track TODAY and will be real before he next opens this file. The state word
   itself rides in the tooltip and in the legend — the dash is only the glance. */
.rb.soon{border-color:var(--warn);border-style:dashed}
.rb.soon .lb{color:var(--warn)}
.rb.building{border-color:var(--accent);border-style:dashed}
.rb.building .lb{color:var(--accent)}
/* Open in Acrobat sits OUTSIDE the mode selector on purpose — see the legend.
   It is not a mode, and a fourth cell in that segmented control would say it is. */
.openin{display:flex;align-items:center;gap:5px;align-self:center;margin-left:8px;padding:3px 8px;border:1px dashed var(--accent);border-radius:3px;font-size:12px;font-weight:500;color:var(--accent)}
/* Solid since 2026-09-04: `file.open_in_acrobat` registers, so the dash would
   now be a lie in the other direction — a built control drawn as unbuilt. */
.openin.shipped{border-style:solid;border-color:var(--line-strong);color:var(--ink)}
.openin:hover{background:var(--plate)}
.openin .g{width:15px;height:15px}
.sw{width:14px;height:14px;border:1px solid var(--line-strong);border-radius:2px}
.rb.big .sw{width:24px;height:16px}

/* document tabs */
.doctabs{display:flex;align-items:flex-end;gap:2px;padding:0 8px;background:var(--chrome-2);border-bottom:1px solid var(--line)}
.doctab{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 10px;font-size:12px;color:var(--ink-quiet);border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0}
.doctab[aria-selected="true"]{background:var(--chrome);color:var(--ink);border-color:var(--line);margin-bottom:-1px}
/* The unsaved-edits marker is a bullet, not a glyph — a settled copy decision
   with three stated grounds. `modified` art was proposed and deferred. */
.doctab .dot{color:var(--accent);font-size:15px;line-height:0}
.doctab .x{width:12px;height:12px;color:var(--ink-quiet)}

/* --------------------------------------------------------------------------
   Body. Columns depend on two knobs: the left arrangement (rail vs one
   five-tab stack) and the right dock's width (320 today vs 360 proposed).
   -------------------------------------------------------------------------- */
.body{display:grid;min-height:0;grid-template-columns:52px 228px minmax(0,1fr) 320px}
/* ★ EXPLICIT COLUMNS, and the reason is a defect this mock actually had.
   The rail is hidden with `display:none` in the five-tab arrangement — and a
   `display:none` child is not a grid item at all, so auto-placement silently
   shifted the panel, the canvas and the dock one column to the LEFT. The
   result rendered without an error: a 0 pt panel, a 280 pt canvas, a dock in
   the canvas's 1fr track and 360 pt of empty ground at the right edge. It was
   invisible in the source and obvious in the screenshot, which is this
   project's standing rule about layout defects having exactly one oracle. */
.rail{grid-column:1}.panel{grid-column:2}.canvas{grid-column:3}.dock{grid-column:4}
.app[data-left="tabs"] .body{grid-template-columns:0 280px minmax(0,1fr) 320px}
.app[data-dock="360"] .body{grid-template-columns:52px 228px minmax(0,1fr) 360px}
.app[data-left="tabs"][data-dock="360"] .body{grid-template-columns:0 280px minmax(0,1fr) 360px}

/* --------------------------------------------------------------------------
   THE RAIL — panel tabs, the navigate selectors, and the selection tools.

   ★ Its WIDTH is a constant (52 px here; `exact_size` in the build). That is
   what discharges the R128 fit-zoom gate by argument, and it is why the fold
   knob shrinks the rail's HEIGHT BUDGET and never its width: a rail that grew
   sideways to fit its widest word would make the gate real, and a rail that
   shrank sideways would just clip its own labels.

   What actually runs out on a vertical strip is rows, and the ladder is
   `RIBBON_SCALING.md`'s own three rungs one surface over — drop the words,
   then fold a group, then fold the next — with the panel tabs as the floor.
   -------------------------------------------------------------------------- */
/* ★ `overflow-y:auto`, never `hidden`. On a short window the roomy rung does
   not fit, and a rail that simply cut its last entry off the bottom edge would
   be losing a control SILENTLY — the same defect as a row clipped
   mid-character, one surface over. Scrolling is the third rung of
   `RIBBON_SCALING.md`'s own ladder (re-wrap → collapse → scroll), so it is the
   answer this project already gives to "it still does not fit". */
.rail{grid-column:1;display:flex;flex-direction:column;gap:1px;padding:6px 4px;border-right:1px solid var(--line);background:var(--chrome-2);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.app[data-left="tabs"] .rail{display:none}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border-radius:2px;font-size:9.5px;color:var(--ink-quiet);border-left:2px solid transparent;text-align:center}
.rail button:hover{color:var(--ink)}
.rail button[aria-selected="true"]{color:var(--accent);border-left-color:var(--accent);background:var(--plate)}
.rail button[aria-pressed="true"]{color:var(--accent);border-left-color:var(--accent);background:var(--plate)}
.rail .spacer{flex:1;min-height:2px}
/* A group separator, not a heading, at the tight rungs: with the words gone
   the only thing telling panel tabs from tools is the gap between them. */
.rail .rule{height:1px;background:var(--line);margin:5px 5px 4px;flex:none}
.rail .gl{font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-quiet);text-align:center;padding:3px 0 1px;flex:none}
/* Icon-only rungs: shorter rows, no words. Set by the renderer, not by CSS,
   because the same rung also decides which GROUPS are drawn at all. */
.rail button.iconly{padding:5px 0;gap:0}
/* ★ The overflow chevron NEVER folds. Getting that backwards is Inkscape
   failure mode #8 — past six tabs the overflow button itself gets hidden —
   and it is the one control that must survive, because everything the rail
   dropped is behind it. */
.rail .chev{border:1px dashed var(--line-strong);border-radius:2px;margin-top:2px;font-family:var(--mono);font-size:9px;padding:4px 0 3px;flex:none}
.rail .chev:hover{border-color:var(--accent);color:var(--accent)}
/* A rail entry the BUILD does not have — the lasso. Same dashed-notice
   vocabulary as `.rb.soon` in the ribbon, so "not built" reads one way. */
.rail button.soon{border:1px dashed var(--warn);color:var(--warn)}

.panel{grid-column:2;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--chrome-2)}
/* the cheap 80 %: one stack, five tabs, at 280 pt — and its overflow chevron */
.tabbar{display:flex;align-items:stretch;height:24px;border-bottom:1px solid var(--line);background:var(--chrome-2);overflow:hidden;flex:none}
.tabbar button{display:flex;align-items:center;gap:4px;padding:0 7px;font-size:11.5px;color:var(--ink-quiet);border-right:1px solid var(--line);white-space:nowrap}
.tabbar button[aria-selected="true"]{background:var(--plate);color:var(--accent)}
/* The overflow marker never shrinks; the last TAB truncates instead. Getting
   this backwards reproduces Inkscape failure mode #8 — "past ~6 tabs the
   overflow button itself gets hidden" — which is a defect, not a demo. */
.tabbar button:not(.more){min-width:0;overflow:hidden}
.tabbar .more{margin-left:auto;border-right:0;color:var(--ink-quiet);font-family:var(--mono);font-size:11px;flex:none}
.ph{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 10px;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line);font-family:var(--cond);flex:none;background:var(--chrome-2)}
.ph .n{font-weight:400;color:var(--ink-quiet);font-family:var(--sans);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .tools{margin-left:auto;display:flex;gap:2px;flex:none}
.ph .tools button{width:20px;height:20px;display:grid;place-items:center;color:var(--ink-quiet);border-radius:2px}
.ph .tools button:hover{background:var(--chrome-3);color:var(--ink)}
.pb{padding:8px 10px;overflow:auto;font-size:12px;color:var(--ink);min-height:0}
.thumbs{display:grid;grid-template-columns:1fr;gap:10px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-quiet)}
.thumb .pg{width:100%;aspect-ratio:1.414;background:var(--paper);border:1px solid var(--line-strong);position:relative}
.thumb[aria-selected="true"] .pg{outline:2px solid var(--accent);outline-offset:1px}
.thumb .pg i{position:absolute;right:0;bottom:0;width:38%;height:22%;border-top:2px solid #C8451E;border-left:1px solid var(--line-strong);background:#fff}
.empty{color:var(--ink-quiet)}
.lrow{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
.lrow .cb{width:13px;height:13px;border:1px solid var(--line-strong);border-radius:2px;display:grid;place-items:center;flex:none;color:var(--accent)}
.lrow .cb.on{background:var(--plate);border-color:var(--accent)}
.lrow .cb.off{opacity:.45}
/* R9 + the padlock's own ruling: drawn ONLY on a locked row, and in
   text_muted rather than the accent, because /Locked is the producer's
   recorded intent and not a state of the application. */
.lrow .pad{color:var(--ink-quiet);flex:none}
.cap{font-size:10.5px;color:var(--ink-quiet);padding:6px 0 0;line-height:1.35}

/* --------------------------------------------------------------------------
   Canvas: bench, rulers, paper.
   -------------------------------------------------------------------------- */
.canvas{grid-column:3;position:relative;background:var(--bench);min-height:0;overflow:hidden}
.ruler{position:absolute;background:var(--chrome-2);color:var(--ink-quiet);font-size:9px;font-family:var(--mono);z-index:2}
.ruler.h{left:18px;right:0;top:0;height:18px;border-bottom:1px solid var(--line-strong)}
.ruler.v{top:18px;bottom:0;left:0;width:18px;border-right:1px solid var(--line-strong)}
.ruler.c{left:0;top:0;width:18px;height:18px;border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong)}
.ruler svg{position:absolute;inset:0;width:100%;height:100%}
.app[data-rulers="off"] .ruler{display:none}
.sheet{position:absolute;left:18px;top:18px;right:0;bottom:0;display:grid;place-items:center;padding:20px}
.app[data-rulers="off"] .sheet{left:0;top:0}
.sheet svg{max-width:100%;max-height:100%;display:block}
/* ★ The page is white on every board. Not themed, deliberately. */
.canvas .paper{fill:var(--paper)}

/* --------------------------------------------------------------------------
   Right dock.
   -------------------------------------------------------------------------- */
.dock{grid-column:4;display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0;background:var(--chrome-2)}
/* The SALVAGE of proposal 3: the armed tool's identity + stage line as a
   per-side dock BANNER — chrome drawn over the columns, not a stack, because
   a 28 pt stack is illegal (MIN_STACK_HEIGHT = 80). It is an ADDITION; it
   takes nothing away from the Tool panel below it. */
/* 26 px, because the shipped constant is `BANNER_HEIGHT_PTS = 26.0` — one row
   of text plus the padding a button needs around it. It was 28 while this was
   a proposal and nobody had measured it; a mock that draws a shipped constant
   two points out is a mock somebody will measure against. */
.banner{display:flex;align-items:center;gap:7px;padding:3px 8px 3px 10px;border-bottom:1px solid var(--line);font-size:12px;background:var(--chrome);flex:none;height:26px;white-space:nowrap;overflow:hidden}
.banner b{font-weight:600}
.banner .st{color:var(--ink-quiet);overflow:hidden;text-overflow:ellipsis}
.banner.armed{color:var(--accent);background:var(--plate)}
.banner.armed .st{color:var(--accent)}
.banner .tagp{flex:none}
/* *Put this tool down* — the third of the three things O123 puts on this line.
   ★ Drawn ONLY when something is armed. Beside `Select` it would be a control
   whose press changes nothing, because Select IS the resting state and putting
   a tool down returns to it — R9 forbids a dead control, and an earlier mock
   shipped exactly that one. */
.banner .pd{margin-left:auto;display:inline-flex;align-items:center;gap:5px;flex:none;
            padding:1px 7px;border:1px solid var(--line-strong);border-radius:2px;font-size:11px}
.banner.armed .pd{border-color:var(--accent)}
.banner .pd:hover{background:var(--chrome-3)}
.banner .pd .g{width:13px;height:13px}
.banner .grow{flex:1;min-width:0}
/* An in-place mark on a surface the product does NOT have. The legend says it
   in words; this says it where the operator is looking. Both, deliberately:
   a legend entry nobody scrolls to is the same as no legend entry. */
.tagp{font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);border:1px dashed var(--accent);border-radius:2px;padding:0 3px;line-height:1.5;opacity:.85}
.rail .tagp{margin:4px 1px 2px;text-align:center;display:block;font-size:7px;letter-spacing:0;padding:0 1px;overflow:hidden}
.stack{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rows{overflow:auto;flex:1;min-height:0}
/* ★★★ Rows ELLIPSISE, with the full text on hover — O123 part 3, and it
   reverses `REVIEW_TRIAGE.md` §4 on the operator's own instruction.

   What they did before: `ScrollArea::both()` measured each row's intrinsic
   width, so at 320 pt a row ran past the pane's right edge and was HARD
   CLIPPED mid-character — the defect the reviewer photographed and read as
   "ours lists less". A clip mid-character is silent; an ellipsis is a mark
   that says *there is more*, and the hover is where the more lives.

   `SALVAGE.md:44`'s actual requirement is no SILENT loss, and this meets it.
   Flip the layout knob to `before O123` to see the clip come back. */
.row{display:grid;grid-template-columns:1fr;gap:6px;align-items:center;padding:3px 10px;font-size:12px;border-bottom:1px solid var(--chrome);white-space:nowrap;overflow:hidden}
.app[data-dock="360"] .row{grid-template-columns:18px 34px 1fr}
.app[data-dock="320"] .row .g,.app[data-dock="320"] .row .id{display:none}
.row .id{font-family:var(--mono);color:var(--ink-quiet);font-size:11px}
.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The one place the ellipsis is NOT drawn: the `before O123` comparison. */
.app[data-layout="today"] .row .t{text-overflow:clip}
.row .t i{font-style:normal;color:var(--ink-quiet)}
.row[aria-selected="true"]{background:var(--plate);color:var(--accent)}
.row[aria-selected="true"] .id,.row[aria-selected="true"] .t i{color:var(--accent)}

/* ★ THE DRAGGABLE SPLIT, and it has to LOOK draggable rather than merely be
   draggable — a 1 px rule between two panes is what a FIXED split looks like,
   and the whole of part 3 is that this one is not fixed. So: a grip of dots,
   a row-resize cursor, a hover that lights the grip in the accent, and a
   pressed state while the drag is live. `.hardline` below is the fixed
   divider it is contrasted against. */
.split{height:11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--chrome);cursor:row-resize;display:grid;place-items:center;flex:none;touch-action:none}
.split i{width:46px;height:4px;border-radius:2px;
         background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 5px)}
.split:hover{background:var(--chrome-3)}
.split:hover i{background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 5px)}
.split.dragging{background:var(--plate)}
.split.dragging i{background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 5px)}
/* The FIXED divider — what the left dock had before part 5, and what the
   right dock's splits must not look like. One rule, no grip, no cursor. */
.hardline{height:1px;background:var(--line-strong);flex:none}
.props{overflow:auto;flex:1;min-height:0;font-size:12px}
.sec{padding:7px 10px 3px;font-size:10.5px;color:var(--ink-quiet);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:4px}
.sec .g{width:12px;height:12px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:3px 8px;padding:0 10px 6px 22px}
.kv div:nth-child(odd){color:var(--ink-quiet)}
.kv div:nth-child(even){font-family:var(--mono);font-size:11.5px;text-align:right;padding-right:4px}
.kv div.tx{font-family:var(--sans);font-size:12px;text-align:left;padding-right:0}
.kv input{width:100%;font:inherit;color:inherit;background:var(--chrome);border:1px solid var(--line);padding:1px 5px;text-align:right;font-family:var(--mono);font-size:11.5px}
.comment{padding:7px 10px;border-bottom:1px solid var(--chrome)}
.comment .who{font-size:11px;color:var(--ink-quiet)}
.comment .acts{display:flex;gap:4px;margin-top:4px}
.comment .acts button{font-size:11px;padding:1px 6px;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink-quiet)}
.field{display:grid;grid-template-columns:1fr;gap:3px;padding:6px 10px}
.field label{font-size:11px;color:var(--ink-quiet)}
.field input{font:inherit;padding:3px 6px;border:1px solid var(--line);background:var(--paper);color:#1C1C1E}

/* --------------------------------------------------------------------------
   ★★★ THE ARMED TOOL'S OWN CONTROLS, INSIDE PROPERTIES — O123 part 2.

   This block is the whole reason part 1 is safe. `SHELL_LAYOUT_PROPOSAL.md`
   §3 refused the one-line tool strip because it DELETES these controls; the
   operator's answer is that they were never the tool panel's to hold — they
   are properties of what is about to be drawn, which is the same kind of
   thing as the properties of what is already drawn.

   ⇒ So they are drawn FIRST in the panel body, above every selection-scoped
   section, for the reason the shipped module gives: these controls sat in the
   top-right corner of the window, the panel changed and the corner did not.
   Tinted so the eye can see it is a different subject from the selection
   sections under it — the armed tool, not the picked object.
   -------------------------------------------------------------------------- */
.tsec{padding:7px 10px 9px;border-bottom:1px solid var(--line);background:var(--chrome)}
.tsec .h{display:flex;align-items:center;gap:6px;font-family:var(--cond);font-size:12.5px;font-weight:600;margin-bottom:5px}
.tsec .h .from{margin-left:auto;font-family:var(--sans);font-weight:400}
.tsec .note{font-size:10.5px;color:var(--ink-quiet);line-height:1.35;margin-top:6px;white-space:normal}
.tsec .pick{margin:0}
.tsec .opt{padding:2px 0;line-height:1.3}
.tsec .none{color:var(--ink-quiet);font-size:11.5px;line-height:1.35;white-space:normal}
/* One picked point of a circular measurement — O107's removable row. */
.prow{display:flex;align-items:center;gap:6px;padding:2px 0;font-family:var(--mono);font-size:11px}
.prow .x{margin-left:auto;width:16px;height:16px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink-quiet)}
.prow .x:hover{border-color:var(--danger);color:var(--danger)}
/* the Tool panel — the thing the one-line strip would have deleted */
.tool{overflow:auto;flex:1;min-height:0;font-size:12px;padding:6px 10px 8px}
.tool h4{font-family:var(--cond);font-size:12.5px;font-weight:600;margin:0 0 2px}
.tool .lead{color:var(--ink-quiet);margin-bottom:8px;white-space:normal;line-height:1.35}
.trow{display:grid;grid-template-columns:22px 1fr;gap:6px;margin-bottom:6px;align-items:start}
.trow .tb{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:2px}
.trow .tb[aria-pressed="true"]{background:var(--plate);color:var(--accent);border-color:var(--accent)}
.trow .s{white-space:normal;line-height:1.3}
.trow .ch{color:var(--ink-quiet);font-size:11px;font-family:var(--mono)}

/* --------------------------------------------------------------------------
   Status bar.
   -------------------------------------------------------------------------- */
.status{display:flex;align-items:center;gap:2px;padding:0 6px;border-top:1px solid var(--line);background:var(--chrome-2);font-size:12px;overflow:hidden}
.sb{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:2px;height:20px;white-space:nowrap}
.sb:hover{background:var(--chrome-3)}
.sb[aria-pressed="true"]{background:var(--plate);color:var(--accent)}
.sb.note{color:var(--warn)}
.sb.info{color:var(--ink-quiet)}
.sep{width:1px;height:14px;background:var(--line);margin:0 4px}
.status .grow{flex:1}
.zoom{font-family:var(--mono);min-width:56px;text-align:center}
.pageno{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px}
.pageno input{width:34px;text-align:center;font:inherit;background:var(--chrome);color:var(--ink);border:1px solid var(--line);padding:1px 2px}

/* --------------------------------------------------------------------------
   MOCK FURNITURE — everything below this line is the mockup's own scaffolding
   and has NO counterpart in the product. It is styled to look unmistakably
   unlike the shell above it so that no screenshot can confuse the two.
   -------------------------------------------------------------------------- */
/* Wraps to a second line rather than scrolling sideways. A control bar with a
   horizontal scrollbar hides its own right-hand end, and the right-hand end is
   where the legend toggle lives — which is the one control that must always be
   reachable, because it is how everything else on this page gets explained. */
.mockbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:4px 8px;background:#1A1B1E;color:#C9CBD0;font-size:11px;border-top:2px solid #4C9AFF}

.mockbar .seg{display:flex;border:1px solid #3A3E45;border-radius:3px;overflow:hidden;flex:none}
.mockbar .seg button{padding:2px 8px;color:#C9CBD0;white-space:nowrap}
.mockbar .seg button+button{border-left:1px solid #3A3E45}
.mockbar .seg button[aria-pressed="true"]{background:#4C9AFF;color:#0B1726;font-weight:600}

.legend{background:#121316;color:#D6D8DC;overflow:auto;height:236px;padding:10px 12px 14px;border-top:1px solid #2B2E34}

.legend h2{font-family:var(--cond);font-size:14px;margin:0 0 2px;color:#FFF;font-weight:600}
.legend .sub{color:#8B9098;font-size:11px;margin-bottom:9px;line-height:1.4;max-width:1240px}
.legend .sub em{color:#C6CAD1;font-style:normal}
/* The first thing on screen is the decision, not the evidence — the detail
   grid below is 22 lines and the drawer shows about six of them at once. */
.verdict{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 8px;font-size:11px}
.verdict .v{padding:2px 9px;border-radius:10px;font-size:10.5px;letter-spacing:.03em}
.verdict .v b{font-size:12px}

/* RULED gets its own colour and not a shade of PROPOSED, because the whole

.verdict .rank em{color:#C6CAD1;font-style:normal}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:6px 14px;align-items:start}
.li{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:5px 0;border-top:1px solid #23262B;align-items:start}
.li .chip{font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;text-align:center;padding:2px 0;border-radius:2px;margin-top:1px}

.li .w{font-size:11px;color:#9AA0A8;line-height:1.42;margin-top:2px}
.li .w em{color:#C6CAD1;font-style:normal}

.li.shipped  .chip{background:#123A20;color:#7FD79A;border:1px solid #1E6236}
.li.ruled    .chip{background:#2A1A3E;color:#C8A6FF;border:1px solid #5B3E96}
.li.proposed .chip{background:#0B2647;color:#7FB6FF;border:1px solid #1C4E8C}
.li.rejected .chip{background:#3A1414;color:#FF9C9C;border:1px solid #7A2626}
.li.noted    .chip{background:#2A2214;color:#E0BE7C;border:1px solid #5C4A22}
/* A RULED line's reference row is the one place the BUILD's state is stated,

.li.ruled .r{color:#9E8AC4}

/* glyph sheet overlay */

<script>
/* ======================================================================
   glyph inventory — written by build-pdfcer-shell.py from the PRODUCT'S OWN
   assets plus the review's un-adopted proposals. Never hand-edited.
   ====================================================================== */
const GLYPHS = {{GLYPHS}};

const $ = (s, r=document) => r.querySelector(s);
const g = (name, cls='') => `<svg class="g ${cls}" aria-hidden="true"><use href="#g-${name}"/></svg>`;
const app = $('#app');

/* ======================================================================
   THE STATE. Every surface re-renders from this object and nothing else.

   ★ `layout` is the comparison knob and the most important control on the
   mock bar. `a7` is the arrangement O123 rules for; `today` is the one that
   was on screen before it. The operator is reading this artifact to check a
   decision he has already made, and being able to flip back to what he
   decided AGAINST is what makes the difference visible at all.
   ====================================================================== */
const state = {
  mode:'edit', tab:'view', selection:true, facing:false,
  layout:'a7',                 /* a7 = O123's ruling | today = before it       */
  leftPanel:'pages', left:'rail', /* rail | tabs — both legal under O123 part 5 */
  dock:'360',                  /* 360 = O123 part 6 in Edit | 320 = before it   */
  railRoom:'roomy',            /* roomy | tight | snug | cramped — the fold     */
  tool:'select',               /* select | addtext | radius | cloud             */
  mdSplit:0.46,                /* Objects' share of the master–detail column    */
  rulers:true,                 /* shipped, ships OFF — see the legend           */
  labels:true, board:'quiet', legend:true, pageDisplay:'scroll', wheelFlip:false
};

/* Is a tool other than the resting one armed? Read in five places; a derived
   predicate rather than a second stored flag, because two flags that mean the
   same thing is how one of them goes stale. */
const armed = () => state.tool !== 'select';
/* The layout knob overrides two others rather than fighting them: the
   arrangement before O123 had one dock width and no rail, so asking for
   `today` at 360 pt with a rail would be picturing a build that never was. */
const effDock = () => (state.layout==='today' || state.mode!=='edit') ? '320' : state.dock;
const effLeft = () => (state.layout==='today') ? 'tabs' : state.left;

/* ======================================================================
   THE RIBBON AS DATA. One command, one tab (shell rule P1).
   item: [label, glyph, opts]   opts: big, on, dis, menu, swatch, radio, noicon
   `noicon` means the command registers with NO icon in the shipped catalog.
   Drawing art there would be inventing a decision — see `select-all` and
   `actual-size` in GLYPH_ADOPTION.md's deferred list.
   ====================================================================== */
const TABS = [
 {id:'file', label:'File', modes:['read','review','edit'], groups:[
   {cap:'File', items:[['New','new-document',{big:1}],['Open…','folder',{big:1}],[['New from template…','new-from-template'],['Recent','recent',{menu:1}],['Close','close']]]},
   {cap:'Recognise', items:[['Recognise text…','recognise-text',{big:1}]]},
   {cap:'Save', items:[['Save','save',{big:1}],[['Save as…','save-as'],['Save a copy…','save-copy'],['Save a compacted copy…','save-compact']]]},
   /* ★ `Export image…` is SHIPPED — `file.export_image`, wired earlier on
      2026-09-04. It sits between the two other export verbs because it is the
      same act, and it is the only one of the three NOT wearing `download`: a
      DXF and a form-data file have no picture, a raster image does, and this

     because three copies of "which tool is up" is how two of them go stale. */
  if (ARMS[glyph]) on = (state.tool===ARMS[glyph]) ? 'true' : 'false';
  if (o.radio==='pd'){
    const want = {'page-single':'single','page-continuous':'scroll','page-facing':'facing','page-facing-continuous':'facingscroll'}[glyph];
    on = state.pageDisplay===want ? 'true' : 'false';
  }
  /* ★ `soon` / `building` mark a control the BUILD does not have. Deliberately
     NOT `disabled`: a disabled button is a REAL control the document cannot
     accept right now, and drawing an unbuilt one that way would tell the
     operator it exists and is unavailable — two different pieces of news, and
     the wrong one is the one that gets scheduled. The dash says "not there
     yet"; the tooltip and the legend say which kind. */
  const soon = o.soon ? ' soon' : (o.building ? ' building' : '');
  const notyet = o.soon ? ' — proposed, not built' : (o.building ? ' — being built now' : '');
  /* ★ `sep` — the shipped `egui_shell::manifest::Item::Separator`, added
     2026-09-05 with the Format tab. It is a rule between two clusters of
     controls inside ONE band, which is a different thing from the band border
     the `.grp` draws, and until now this mock had no way to say it — so the
     Font group would have had to be drawn as two columns, which says
     "these wrap" rather than "these are two clusters".
     ⚠ It deliberately carries no condition of its own. `Item::Separator`
     cannot take one, and its docs give the reason: a divider's visibility is a
     fact about its NEIGHBOURS, and a separator with an independently-set
     condition is a contradiction that renders. Here the `editOnly` on it is
     the same flag all five of its neighbours carry, so the whole band appears
     or none of it does and the rule can never be left standing alone. */
  if (o.sep) return '<span class="sep" aria-hidden="true"></span>';
  const dis = (o.dis || (o.needsSel && !state.selection)) ? ' disabled' : '';
  const icon = o.swatch ? `<span class="sw" style="background:${o.swatch}"></span>`
             : (o.noicon || !glyph) ? '' : g(glyph, big?'big':'');
  const car = o.menu ? g('chevron-down','car') : '';
  const data = glyph ? ` data-glyph="${glyph}"` : '';
  const act = o.rulers ? ' data-act="rulers"' : '';
  return `<button class="rb${big}${soon}" ${on!==null?`aria-pressed="${on}"`:''}${dis}${data}${act} title="${label}${notyet}">${icon}<span class="lb">${label}</span>${car}</button>`;
}
function renderTabs(){
  const tabs = TABS.filter(t => t.modes.includes(state.mode) && (!t.ctx || state.selection));
  if (!tabs.find(t=>t.id===state.tab)) state.tab = tabs[0].id;
  $('#tabs').innerHTML = tabs.map(t=>`<button role="tab" data-tab="${t.id}" class="${t.ctx?'ctx':''}" aria-selected="${t.id===state.tab}">${t.label}</button>`).join('');
  const tab = TABS.find(t=>t.id===state.tab);
  $('#ribbon').innerHTML = tab.groups.map(gr=>{
    const keep = x => !(x[2] && x[2].editOnly && state.mode!=='edit');
    const items = gr.items.map(it => Array.isArray(it[0])
      ? `<div class="col">${it.filter(keep).map(itemHtml).join('')}</div>`
      : (keep(it) ? itemHtml(it) : '')).join('');
    /* ★★ A GROUP WITH NOTHING LEFT IS NOT DRAWN — added 2026-09-05, and it
       mirrors `egui-shell`'s own `a_group_with_nothing_left_is_not_drawn`
       rather than inventing a rule. Until the Format tab's Font band arrived,
       no group in this mock could lose all its items, so the omission had no
       symptom; the Font band is `editOnly` throughout, so in Review it would
       have rendered as a captioned empty box — a band that says "Font" and
       offers nothing, which is worse than a missing band and is not what the
       product does. ⇒ **An untested branch of a mock is as capable of lying
       as an untested branch of the build.** */
    if (!items.trim()) return '';
    return `<div class="grp"><div class="items">${items}</div><div class="cap">${gr.cap}</div></div>`;
  }).join('');
}

/* ======================================================================
   LEFT SIDE — O123 part 5, and the rail his last paragraph redefines.

   ★★★ WHAT THE RAIL IS FOR CHANGED. It was five panel tabs. He added:

     "the navigate selectors and some other related selection controls
      (lasso tool when we implement one, etc) and these will fold up into a
      drop down arrow if space becomes scarce."

   So it is now THREE groups on one strip — panel tabs, the navigate
   selectors, the selection tools — and the interesting part is not the list,
   it is what happens when they do not all fit.

   ── THE FOLD LADDER, and why it is this order ───────────────────────────
   `RIBBON_SCALING.md` already answers "what happens when the controls do not
   fit" for the ribbon, in three rungs: re-wrap, then collapse, then scroll.
   The rail reuses that reasoning rather than inventing a second answer, and
   the rungs land as:

     roomy    everything, with its word under it
     tight    THE WORDS GO FIRST. Every control is still one click away — the
              cheapest thing to give up is the label, not the control.
     snug     the SELECTION group folds into the chevron. It is the specialist
              gesture; nothing in it has a keyboard chord or a ribbon button
              an operator reaches by habit.
     cramped  the NAVIGATE group folds too — except the one that is ARMED,
              which stays pinned. A rail that cannot say what you are holding
              has stopped doing the one job the tool strip handed it.

   ★★ THE PANEL TABS ARE THE FLOOR AND NEVER FOLD. "All five panels one click
   away" is the rail's entire argument for existing; a rail that folds them is
   strictly worse than the five-tab stack it replaced, and at that point the
   honest move is to switch arrangements, not to keep shrinking.

   ★ AND THE CHEVRON ITSELF NEVER FOLDS. Inkscape failure mode #8 — past about
   six tabs the overflow button gets hidden — is this exact control eating
   itself. Everything the rail dropped is behind it.

   ── The two arrangements the knob switches between ──────────────────────
   `rail`  a permanently visible vertical strip. Its width is a CONSTANT
           (52 px here, `exact_size` in the build), which discharges the R128
           fit-zoom gate by argument. Size it from its widest word and the
           gate becomes real.
           ★ This is NOT S6. S6's rail is a collapsed-state SUBSTITUTE for a
           hidden dock. This one replaces the dock's arrangement while the
           dock is open. VS Code's activity bar, not its collapsed sidebar.

   `tabs`  one five-tab stack, no rail. Also legal under part 5 — "Layers,
           Signatures and Fonts join Pages and Bookmarks as tabs in ONE dock"
           is satisfied either way. At 280 pt three tabs fit and two go behind
           a chevron, which is the cost a vertical rail does not pay.
   ====================================================================== */
const RAIL = [['pages','Pages','pages'],['bookmarks','Marks','bookmarks'],['layers','Layers','layers'],['signatures','Sigs','signatures'],['fonts','Fonts','fonts']];
const PTITLE = {pages:'Pages', bookmarks:'Bookmarks', layers:'Layers', signatures:'Signatures', fonts:'Fonts'};

/* The navigate selectors — the four modal tools, exactly as View ▸ Navigate
   registers them. All four ship, all four have art of their own. */
const RAIL_NAV = ['select','points','text','hand'].map(id=>[id, TOOLS[id].name, TOOLS[id].glyph, TOOLS[id].sentence]);
/* The selection tools. ONE row, and the group is honest about being one row:
   the lasso is the only member he named and it does not exist yet, so a
   second entry would be a control invented to make a group look full.
   ⚠ `shape-ink` is BORROWED art — the freehand pen's own picture. There is no
   `lasso` asset in `icons/assets`, and drawing one here would put a picture in
   the mock that the build has no way to render. Stated in the legend. */
const RAIL_SEL = [
  ['lasso','Lasso','shape-ink','Draw a loop around what you want picked. NOT BUILT — and this is the freehand pen’s art, borrowed.',true],
];

/* How many rows the rail can afford, per rung — the mock’s stand-in for a
   short window. Width is deliberately NOT what shrinks; see the CSS header. */
const RAIL_ROOM = {roomy:{words:true, sel:true, nav:'all'},
                   tight:{words:false, sel:true, nav:'all'},
                   snug: {words:false, sel:false, nav:'all'},
                   cramped:{words:false, sel:false, nav:'armed'}};

function panelBody(id){
  const cb = on => `<span class="cb ${on?'on':'off'}">${on?'✓':''}</span>`;
  switch(id){
    case 'pages': return `<div class="pb"><div class="thumbs"><div class="thumb" aria-selected="true"><div class="pg"><i></i></div><span>1 · A1 landscape</span></div></div></div>`;
    case 'bookmarks': return `<div class="pb empty">No bookmarks.<div style="margin-top:8px"><button class="rb" style="border-color:var(--line-strong)">${g('bookmarks')}<span class="lb">Add one at page 1</span></button></div></div>`;
    case 'layers': return `<div class="pb">
        <div class="lrow">${cb(true)}<span>Base plan</span></div>
        <div class="lrow">${cb(true)}<span>Dimensions</span></div>
        <div class="lrow">${cb(false)}<span style="color:var(--ink-quiet)">Ventilation</span>${g('lock','pad')}</div>
        <div class="cap">The padlock is drawn only on the <code>/Locked</code> row, in muted ink rather than the accent, because <code>/Locked</code> is the producer's recorded intent and not a state of the application. <em>Drawn populated so the padlock is visible — the fixture on the board has no layers, which is itself the rail's argument.</em></div>
      </div>`;
    case 'signatures': return `<div class="pb empty">Not signed.</div>`;
    case 'fonts': return `<div class="pb">
        <div class="lrow">${g('fonts')}<span>SpaceGrotesk-Bold <i style="font-style:normal;color:var(--ink-quiet)">· embedded subset</i></span></div>
        <div class="lrow">${g('fonts')}<span>JetBrainsMono-Regular <i style="font-style:normal;color:var(--ink-quiet)">· embedded subset</i></span></div>
        <div class="lrow">${g('info')}<span>Inter <i style="font-style:normal;color:var(--ink-quiet)">· not embedded, substituted</i></span></div></div>`;
  }
}
const PCOUNT = {pages:'1 page', fonts:'3', bookmarks:'', layers:'3', signatures:''};

function renderLeft(){
  const tools = `<div class="tools"><button title="Float this panel">${g('floating-panels')}</button><button title="Close">${g('close')}</button></div>`;
  const count = PCOUNT[state.leftPanel] || '';
  const head = id => `<div class="ph">${PTITLE[id]} <span class="n">${PCOUNT[id]||''}</span>${tools}</div>`;

  /* ---- the arrangement BEFORE O123 part 5: two docks, a FIXED divider ----
     Pages and Bookmarks in one stack, Layers / Signatures / Fonts in a second
     below it, split at a height nobody chose and nobody can move. Part 5 is
     one sentence — "join … as tabs in ONE dock" — and this is what it is one
     sentence about. Drawn so the difference is visible rather than described. */
  if (state.layout==='today'){
    $('#rail').innerHTML = '';
    const topSel = ['pages','bookmarks'].includes(state.leftPanel) ? state.leftPanel : 'pages';
    const botSel = ['layers','signatures','fonts'].includes(state.leftPanel) ? state.leftPanel : 'layers';
    const bar = ids => `<div class="tabbar">${ids.map(id=>`<button data-panel="${id}" aria-selected="${state.leftPanel===id}">${g(RAIL.find(r=>r[0]===id)[2])}${PTITLE[id]}</button>`).join('')}</div>`;
    $('#leftpanel').innerHTML =
        `<div class="stack" style="flex:1">${bar(['pages','bookmarks'])}${head(topSel)}${panelBody(topSel)}</div>`
      + `<div class="hardline" title="A fixed split. Not draggable — this is what part 5 replaces."></div>`
      + `<div class="stack" style="flex:1">${bar(['layers','signatures','fonts'])}${head(botSel)}${panelBody(botSel)}</div>`;
    return;
  }

  if (effLeft()==='rail'){
    const room = RAIL_ROOM[state.railRoom];
    const w = lb => room.words ? `<span>${lb}</span>` : '';
    const cls = room.words ? '' : ' iconly';
    const folded = [];   /* what went behind the chevron, in the order it went */

    /* Group 1 — the panel tabs. The FLOOR. Never folded, at any rung. */
    let html = RAIL.map(([id,lb,gl])=>
      `<button role="tab" class="${cls.trim()}" data-panel="${id}" aria-selected="${state.leftPanel===id}" title="${PTITLE[id]}">${g(gl)}${w(lb)}</button>`).join('');

    /* Group 2 — the navigate selectors. At `cramped` the group collapses to a
       SINGLE pinned row showing whatever is armed — including a tool armed
       from another ribbon tab, drawn with its own glyph. A rail that cannot
       say what you are holding has given up the job the one-line tool strip
       handed it, and that is the one thing this group must not stop doing. */
    /* ⚠ Mode-gated, exactly as View ▸ Navigate already gates them. `Points`
       edits the nodes of a path and Read cannot; drawing it there would be an
       authoring control on a mode whose own dispatch refuses it, which is a
       defect this project has already shipped once and fixed. */
    const nav = RAIL_NAV.filter(r => r[0]!=='points' || state.mode==='edit');
    html += `<div class="rule"></div>` + (room.words?`<div class="gl">navigate</div>`:'');
    if (room.nav === 'all'){
      html += nav.map(([id,lb,gl,tip])=>
        `<button class="${cls.trim()}" data-arm="${id}" aria-pressed="${state.tool===id}" title="${lb} — ${tip}">${g(gl)}${w(lb)}</button>`).join('');
    } else {
      const t = TOOLS[state.tool];
      html += `<button class="${cls.trim()}" data-arm="${state.tool}" aria-pressed="true" title="${t.name} — armed. The rest of this group is behind the chevron.">${g(t.glyph)}${w(t.name)}</button>`;
      nav.filter(r=>r[0]!==state.tool).forEach(r=>folded.push(r[1]));
    }

    /* Group 3 — the selection tools. Folds BEFORE navigate. Not drawn in Read:
       a lasso picks page CONTENT, which is the one thing Read does not do. */
    if (room.sel && state.mode!=='read'){
      html += `<div class="rule"></div>` + (room.words?`<div class="gl">select</div>`:'')
        + RAIL_SEL.map(([id,lb,gl,tip,soon])=>
          `<button class="${cls.trim()}${soon?' soon':''}" title="${lb} — ${tip}">${g(gl)}${w(lb)}</button>`).join('');
    } else if (state.mode!=='read'){
      RAIL_SEL.forEach(r=>folded.push(r[1]));
    }

    /* The chevron. Drawn only when it holds something; a chevron over an empty
       overflow is the dead control R9 forbids. It never folds itself. */
    const chev = folded.length
      ? `<button class="chev" title="Folded away, in the order they went: ${folded.join(', ')}">${g('chevron-down')}<span>${folded.length}</span></button>` : '';

    $('#rail').innerHTML = html + chev
      + `<div class="spacer"></div>`
      + `<span class="tagp" title="Ruled in O123 and not started. Not S6 either — see the legend.">ruled</span>`
      + `<button class="${cls.trim()}" title="Collapse the dock">${g('chevron-left')}${w('Hide')}</button>`;

    $('#leftpanel').innerHTML = head(state.leftPanel) + panelBody(state.leftPanel);
  } else {
    /* ONE dock, five tabs — part 5 without the rail. Three fit at 280 pt and
       the other two go behind the overflow chevron. */
    const shown = RAIL.slice(0,3), hidden = RAIL.slice(3);
    const sel = RAIL.find(r=>r[0]===state.leftPanel);
    const list = shown.some(r=>r[0]===state.leftPanel) ? shown : [sel, shown[0], shown[1]];
    $('#rail').innerHTML = '';
    $('#leftpanel').innerHTML =
      `<div class="tabbar">${list.map(([id,,gl])=>`<button data-panel="${id}" aria-selected="${state.leftPanel===id}">${g(gl)}${PTITLE[id]}</button>`).join('')}<button class="more" title="${hidden.map(h=>PTITLE[h[0]]).join(', ')}">⏷ 2 more</button></div>`
      + head(state.leftPanel) + panelBody(state.leftPanel);
  }
}

  'stroked #2A2B2E, 1.43 pt wide · 6 node(s)'],

/* ======================================================================
   THE TOOL PANEL — the surface O123 part 1 RETIRES. Drawn only on the
   `before O123` setting of the layout knob, so the operator can see what he
   ruled against beside what he ruled for.

   Its four blocks: A (the pointer sentence, unconditional and drawn FIRST
   because "the row an operator's eye lands on must not move"), B (the tool
   list, hard-capped at seven rows), B′ (Select's own three scale switches),
   and C (the disclosure slot).

   ★ Where each block went is the whole of parts 1 and 2:
       A  → the status strip's sentence
       B  → GONE, and it is the one genuine subtraction. Every row was a
            route to a ribbon command; "its buttons duplicate the ribbon and
            go" is his instruction, by name. Worth recording that the list was
            the answer to a real discoverability defect — "The feature works.
            He could not find it." — and that what survives of that argument
            is the strip, which is permanent, names what is armed at frame one,
            and cannot be closed. The panel could say none of that.
       B′ → Properties, `properties::tool::scale_switches`
       C  → Properties, `properties::disclose`
   ====================================================================== */
const TOOLROWS = [
  ['pointer','Select','Pick a shape, then drag it. The tool everything comes back to.','View · V'],
  ['show-points','Points','Show every node on the picked path and drag them one at a time.','View · N'],
  ['text-select','Text','Sweep across words to select them, then restyle or replace them.','View · T'],
  ['hand','Hand','Push the sheet around without touching anything on it.','View · H'],
];

const cb = (on,label) => `<div class="opt"><span class="cb ${on?'on':''}">${on?'✓':''}</span><span>${label}</span></div>`;

/* ======================================================================
   ★★★ THE ARMED TOOL'S CONTROLS — ONE function, drawn in TWO homes.

   This is the load-bearing piece of the whole artifact. O123 part 1 removes
   the Tool panel; `SHELL_LAYOUT_PROPOSAL.md` §3 refused that because it
   DELETES these controls. Part 2 is the answer — they move to Properties.

   Writing them once and rendering them in both places is not a code-saving.
   It is the claim itself, made checkable: flip the layout knob and the same
   three switches, the same pen, the same pick list appear in the other home.
   If they were two copies, one of them could quietly become a shorter list
   and the mock would be arguing for something it was not showing.

   Every label below is the string the build already ships
   (`text/tool.rs::scale_stroke_label`, `text_pen_*`, `measure_points_*`).
   ====================================================================== */
function toolBlockInner(){
  const block = TOOLS[state.tool].block;
  if (block === 'scale'){
    return `<div class="h">When you resize something</div>
      ${cb(true,'Scale line weight')}
      ${cb(true,'Keep the inner margins the same size')}
      ${cb(false,'Allow the artwork to distort (borders may come out uneven)')}
      <div class="note">These apply to the next resize. Line weight stays put by default, because on a drawing it is a drafting standard rather than decoration — the same default Acrobat, Illustrator and Inkscape all ship.</div>`;
  }
  if (block === 'pen'){
    return `<div class="h">New text</div>
      <div class="pick">
        <label>Font</label><select><option>SpaceGrotesk-Bold</option><option>JetBrainsMono-Regular</option></select>
        <label>Size</label><input value="8.00">
        <label>Colour</label><div class="swatch" style="background:#C8451E"></div>
      </div>
      <div class="note">These apply to the next text you add. They do not change text already on the page.</div>`;
  }
  if (block === 'points'){
    /* O107: "clicking on a point or location listed should allow us to remove
       it." The canvas markers say WHERE the points are; on a dense CAD sheet a
       marker sitting on a junction is not distinguishable from the junction,
       so this list is the only surface that answers "what is in this fit?" */
    return `<div class="h">Points in this measurement</div>
      ${[['1','418.20, 236.55'],['2','452.90, 208.14'],['3','487.60, 236.55']]
        .map(([n,xy])=>`<div class="prow"><span style="color:var(--ink-quiet)">${n}</span><span>${xy}</span><button class="x" title="Remove this point">${g('close')}</button></div>`).join('')}
      <div class="note">Three points fix the arc. Remove one and the fit waits for another.</div>`;
  }
  /* R9: no heading with nothing under it. Most tools have no settings, and
     saying so plainly is better than an empty box that reads as a bug. */
  return `<div class="h">${TOOLS[state.tool].name}</div>
     <div class="none">This tool has no settings of its own. Most do not — the shape, the colour and the line width of what it draws are Markup&nbsp;▸&nbsp;Style on the ribbon.</div>`;
}

function toolPanel(){
  if (armed()){
    return `<div class="tool">
      <h4>${TOOLS[state.tool].name}</h4>
      <div class="lead">Armed. ${TOOLS[state.tool].sentence}</div>
      <div class="tsec" style="border:0;padding:0;background:none">${toolBlockInner()}</div>
      <button class="putdown">${g('put-down')}Put this tool down <kbd>Esc</kbd></button>
      <div class="disc"><span class="indic">indicative</span> A click was declined because the words under the pointer are drawn inside a form XObject that this document reuses on more than one page, and editing them here would silently change every other place the drawing appears, so the pen declines rather than doing that quietly.</div>
    </div>`;
  }
  return `<div class="tool">
    <h4>Select</h4>
    <div class="lead">Pick a shape, then drag it. The tool everything comes back to.</div>
    ${TOOLROWS.map(([gl,name,sent,chord])=>`<div class="trow"><button class="tb" aria-pressed="${gl==='pointer'}" title="${name}">${g(gl)}</button><div><div class="s"><b>${name}</b> — ${sent}</div><div class="ch">${chord}</div></div></div>`).join('')}
    <div class="cap"><span class="indic">indicative</span> Only Select's and Cloud's sentences are quoted verbatim; the shipped strings live in <code>text/tool.rs</code>. The list is hard-capped at seven rows. <b>This whole list is what O123 removes</b> — every row is a route to a ribbon command.</div>
    <div class="tsec" style="border:0;padding:8px 0 0;background:none">${toolBlockInner()}</div>
    <div class="disc"><span class="indic">indicative</span> A click was declined because the words under the pointer are drawn inside a form XObject that this document reuses on more than one page, and editing them here would silently change every other place the drawing appears, so the pen declines rather than doing that quietly.</div>
  </div>`;
}

function renderDock(){
  const d = $('#dock');
  const hdrTools = (extra='') => `<div class="tools">${extra}<button title="Float this panel">${g('floating-panels')}</button><button title="Close">${g('close')}</button></div>`;

  /* ★★★ O123 PART 1 — THE ONE-LINE TOOL STATUS.
     Name, one sentence, and *Put this tool down*. 26 pt of permanent chrome
     the right dock reserves off the top before it resolves its columns; not a
     stack, because `plan::MIN_STACK_HEIGHT` is 80 pt and the tab bar alone is
     24 — a 26 pt stack is a tab bar with two points under it.

     Three things it does that the panel could not: it cannot be closed, it
     names what is armed at frame one with no clicks, and it draws its sentence
     even when it cannot name the tool (O66 — a dialog-armed placement has no
     ribbon command to name, and a missing name must suppress the NAME, never
     the sentence).

     ★ *Put this tool down* is ABSENT beside Select. Select is the resting
     state; putting a tool down returns to it, so the button's press would
     change nothing, and R9 forbids a dead control. */
  const T = TOOLS[state.tool];
  const hover = 'What you are holding. Its settings — font, size, colour, measuring options, resize switches — are in Properties.';
  const banner = `<div class="banner${armed()?' armed':''}" title="${hover}">${g(T.glyph)}<b>${T.name}</b><span class="st">— ${T.sentence}</span>`
    + (armed() ? `<button class="pd" title="Put this tool down (Esc)">${g('put-down')}Put this tool down</button>` : `<span class="grow"></span>`)
    + `<span class="tagp" title="Ruled in O123; landed in the tree 2026-09-04.">ruled</span></div>`;

  if (state.mode==='read'){
    d.innerHTML = `<div class="ph">Fill form <span class="n">1 field</span>${hdrTools()}</div>
      <div class="props"><div class="field"><label>Full name · page 1</label><input value="Ada Lovelace"></div>
      <div class="sec">Tab order</div><div class="kv"><div class="tx">1</div><div class="tx">Full name</div></div>
      <div class="sec">Calculated fields</div><div class="kv"><div class="tx" style="grid-column:1/-1;color:var(--ink-quiet)">None.</div></div>
      <div style="display:flex;gap:4px;padding:8px 10px"><button class="rb" style="border-color:var(--line-strong)"><span class="lb">Reset to defaults</span></button><button class="rb" style="border-color:var(--line-strong)">${g('form-flatten')}<span class="lb">Flatten form</span></button></div></div>`;
    return;
  }

  if (state.mode==='review'){
    d.innerHTML = (state.layout==='today'?'':banner) + `<div class="ph">Comments <span class="n">13</span>${hdrTools(`<button title="Filter">${g('search')}</button>`)}</div><div class="rows">
      ${[['FreeText · p. 1','documenttype','Construction drawing'],['FreeText · p. 1','kenmerk','OA-2026-001-A100'],['Square · p. 1','you · just now','Rectangle, 2.0 pt, no fill'],['FreeText · p. 1','projectnaam','Project name'],['Cloud · p. 1','reviewer','Check flange thickness against S355J2+N']]
        .map(([k,w,t])=>`<div class="comment"><div style="display:flex;gap:6px;align-items:center">${g(k.startsWith('Cloud')?'shape-cloud':k.startsWith('Square')?'shape-rect':'text-freetext')}<b>${k}</b></div><div class="who">by ${w}</div><div>${t}</div><div class="acts"><button>${g('edit')} Edit note</button><button>${g('zoom-selection')} Go to</button></div></div>`).join('')}
    </div>`;
    return;
  }

  const proposed = effDock()==='360';
  /* Objects header. TODAY: two prose lines above the list — the disclosure
     rule is "every disclosure ABOVE the list, without exception". PROPOSED:
     the same two facts compressed into the header row, which keeps them above
     the list and is therefore compatible in spirit. The operator's call. */
  const objHead = proposed
    ? `<div class="ph">Objects <span class="n">28 on this page · front first</span>${hdrTools(`<button title="Filter">${g('search')}</button>`)}</div>`
    : `<div class="ph">Objects${hdrTools(`<button title="Filter">${g('search')}</button>`)}</div>
       <div style="padding:5px 10px 6px;font-size:11.5px;color:var(--ink-quiet);line-height:1.35;border-bottom:1px solid var(--chrome)">Everything drawn on this page, front-most first — the object painted last is the first row.<br>28 object(s) on this page — 13 path(s), 15 text object(s).</div>`;

  /* ★★★ O123 PART 3 — the rows ELLIPSISE, and the full text is the `title`.
     The tooltip is not decoration: it is the half of part 3 that makes the
     ellipsis legal. `SALVAGE.md:44` forbids SILENT loss, not loss — an
     ellipsis plus a hover is loss that announces itself and can be recovered
     without resizing anything. Flip the layout knob to `before O123` and the
     same rows go back to being cut mid-character with nowhere to read them. */
  const rows = OBJECTS.map(([n,gl,ty,today,prop])=>{
    const body = `${ty} · ${proposed?prop:today}`;
    return `<div class="row" aria-selected="${state.selection && n===26}" title="#${n} ${body}">${g(gl)}<span class="id">#${n}</span><span class="t">${proposed?'':'#'+n+' '}${ty} <i>· ${proposed?prop:today}</i></span></div>`;
  }).join('');

  /* The Properties stack's tab bar — six panels share it. At 320 pt three fit
     and three go behind `⏷ 3 more`; at 360 four fit. This is the same
     overflow the left side has, and it is why five horizontal tabs do not fit
     in 280 pt either. */
  const ptabs = ['Properties','Comments','Fill form','Redact'];
  const shownTabs = proposed ? ptabs.slice(0,4) : ptabs.slice(0,3);
  const moreTabs = 6 - shownTabs.length;

  /* ★★★ O123 PART 2 — the armed tool's controls, FIRST in the Properties body.
     Above every selection-scoped section, for the reason the shipped module
     gives: these controls sat in the top-right corner of the window, the panel
     changed and the corner did not. And deliberately NOT part of the panel's
     `something_drew` predicate — an armed Select draws its three switches
     almost always, and folding that into "a selection-scoped section has
     spoken" would collapse the document section for ever (O75, backwards). */
  const toolSection = `<div class="tsec">
      ${toolBlockInner()}
      <div class="note"><span class="indic">moved</span> These were the Tool panel's. They are properties of what is about to be drawn, which is the same kind of thing as the properties of what is already drawn — so this is the surface that owns them.</div>
    </div>`;

  /* ★ NOT drawn on the `before O123` setting, and this is a correctness point
     rather than a tidiness one: before part 2 these controls were in the Tool
     panel, and drawing them in BOTH places would picture a build in which they
     existed twice — which is the arrangement nobody had and nobody proposed. */
  const propsBody = `<div class="props">${state.layout==='today' ? '' : toolSection}${state.selection ? `
      <div class="sec">${g('fit-page')} Position and size <span style="margin-left:auto;text-transform:none;letter-spacing:0">pt · from bottom-left</span></div>
      <div class="kv"><div>Left</div><div><input value="1817.01"></div><div>Bottom</div><div><input value="28.35"></div><div>Width</div><div><input value="538.58"></div><div>Height</div><div><input value="311.81"></div><div>Rotation</div><div><input value="0.00"></div></div>
      <div class="sec">Text</div>
      <div class="kv"><div>Content</div><div class="tx">SIZE</div><div>Font</div><div class="tx">BAAAAA+JetBrainsMono-Regular <i style="font-style:normal;color:var(--ink-quiet)">· embedded subset</i></div><div>Size</div><div>5.50</div><div>Fill</div><div class="tx"><span class="sw" style="display:inline-block;vertical-align:-3px;background:#6B6D72"></span> #6B6D72</div></div>
      <div class="sec">${g('layers')} Placement</div>
      <div class="kv"><div>Page</div><div>1</div><div>Paint order</div><div>26 of 28</div><div>Clip</div><div class="tx">none</div></div>
      <div style="padding:4px 10px 10px;color:var(--ink-quiet);font-size:11px;line-height:1.35">The subset tag <code>BAAAAA+</code> stays here even when the row above drops it: two subsets of one face carry different tags.</div>`
      : `<div class="pb empty" style="padding:8px 10px">Nothing is selected. Pick a row above, or click an object on the sheet.</div>`}</div>`;

  const propsStack = `<div class="stack" style="flex:${(1-state.mdSplit).toFixed(3)}">
      <div class="tabbar">${shownTabs.map((t,i)=>`<button aria-selected="${i===0}">${t}</button>`).join('')}<button class="more" title="Dimension groups, Attachments">⏷ ${moreTabs} more</button></div>
      <div class="ph">Properties <span class="n">${state.selection?'#26 · Text':'nothing picked'}</span>${hdrTools()}</div>
      ${propsBody}
    </div>`;

  /* ---- the arrangement BEFORE O123: three stacks, and the Tool panel is one
     of them. Note what it costs — the Tool panel takes a third of the column,
     Properties gets what is left, and the object rows get the middle. */
  if (state.layout==='today'){
    d.innerHTML =
      `<div class="stack" style="flex:1.3"><div class="ph">Tool${hdrTools()}</div>${toolPanel()}</div>
       <div class="split" title="Drag to resize"><i></i></div>
       <div class="stack" style="flex:1.35">${objHead}<div class="rows">${rows}</div></div>
       <div class="split" title="Drag to resize"><i></i></div>
       ${propsStack}`;
    return;
  }

  /* ★★★ O123 PARTS 3 and 4 — ONE master–detail column, in the Tool panel's
     room. Objects above, Properties below, and a DRAGGABLE split between
     them: `dock.right.0.split.row.0`, the dock's own stack splitter. Grab it
     and the two panes trade height — which is the part a picture of a line
     cannot say on its own, and why it is drawn with a grip and a resize
     cursor rather than as a rule. */
  d.innerHTML = banner
    + `<div class="stack" style="flex:${state.mdSplit.toFixed(3)}">${objHead}<div class="rows">${rows}</div></div>`
    + `<div class="split" id="mdsplit" title="Drag to move the split between Objects and Properties"><i></i></div>`
    + propsStack;
}

/* ★ The split is dragged for real, not merely drawn draggable. A mock whose
   splitter does not move is a mock that asserts "draggable" and demonstrates
   "a line", and the operator is looking at this to check exactly that claim.
   Bound once on the document, because the element is replaced on every
   render and a listener attached to it would be lost with it. */
let dragging = null;
document.addEventListener('pointerdown', e=>{
  const s = e.target.closest('#mdsplit'); if(!s) return;
  dragging = s.closest('.dock').getBoundingClientRect();
  s.classList.add('dragging'); s.setPointerCapture?.(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const f = (e.clientY - dragging.top - 26) / (dragging.height - 26);
  state.mdSplit = Math.min(0.86, Math.max(0.14, f));   /* both panes stay usable */
  renderDock();
});
document.addEventListener('pointerup', ()=>{ dragging = null; renderDock(); });

/* ======================================================================
   STATUS BAR. Note what is NOT here: no first-page and no last-page buttons.
   There is no such control anywhere in the tree — the page group is
   ⏴ ⟨n⟩ / ⟨N⟩ ⏵ and nothing else — and the art proposed for them was
   deferred for exactly that reason. Drawing them would be inventing controls.
   The note badge and the wheel toggle draw NO icon: every candidate home for
   the `note` triangle is a place this project has already ruled against an
   icon, and `wheel-flip`'s asset ships unclaimed pending an operator ruling.
   ====================================================================== */
function renderStatus(){
  const fit = (lb,gl,on)=>`<button class="sb" aria-pressed="${on?'true':'false'}" title="${lb}">${gl?g(gl):''}<span>${lb}</span></button>`;
  $('#status').innerHTML =
   `<button class="sb note" title="1 render note: 119 glyphs drawn with a bundled substitute face"><span>1 note</span></button>
    <span class="sep"></span>
    <span class="sb info">${state.selection&&state.mode!=='read' ? 'Selected: Text · 13.0 × 15.3 pt · 1 of 2 here' : 'A1 landscape · 841 × 594 mm · PDF 1.3'}</span>
    <span class="grow"></span>
    <button class="sb" aria-pressed="${armed()?'false':'true'}" title="Select tool (V)">${g(TOOLS[state.tool].glyph)}<span>${TOOLS[state.tool].name}</span></button>
    <button class="sb" title="Find (Ctrl+F)">${g('search')}<span>Find</span></button>
    <span class="sep"></span>
    ${fit('Actual size',null,false)}${fit('Fit page','fit-page',true)}${fit('Fit width','fit-width',false)}${fit('Fit height','fit-height',false)}
    <span class="sep"></span>
    <button class="sb" title="Zoom out">${g('zoom-out')}</button><button class="sb zoom" title="Zoom presets and maximum zoom">40 %</button><button class="sb" title="Zoom in">${g('zoom-in')}</button>
    <span class="sep"></span>
    <button class="sb" title="Previous page">${g('chevron-left')}</button>
    <span class="pageno"><input value="1" aria-label="Page"> / ${state.facing?2:1}</span>
    <button class="sb" title="Next page">${g('chevron-right')}</button>
    <span class="sep"></span>
    <button class="sb" id="kWheel" aria-pressed="${state.wheelFlip}" title="${state.wheelFlip ? 'On: the mouse wheel turns to the next or previous page.' : 'Off: the mouse wheel scrolls down the page and moves on at the end.'}"><span>Wheel turns pages</span></button>`;
}
