  'Your addition, and it changes what the rail is for: <em>"the navigate selectors and some other related selection controls (lasso tool when we implement one, etc) and these will fold up into a drop down arrow if space becomes scarce."</em> Three groups on one strip. <b>Turn the <em>rail room</em> knob down and watch what folds, and in what order.</b> The ladder is <code>RIBBON_SCALING.md</code>\'s own, one surface over: <b>Roomy</b> everything with words → <b>Tight</b> the words go first, every control still one click away → <b>Snug</b> the selection group folds into the chevron → <b>Cramped</b> the navigate group folds too, except the one that is <em>armed</em>, which stays pinned. ★★ <b>The five panel tabs never fold</b> — "all five panels one click away" is the rail\'s entire argument for existing, and a rail that folds them is strictly worse than the tab stack it replaced. ★ <b>And the chevron never folds itself</b>: that is Inkscape failure mode #8, the overflow button being the thing that gets hidden, and everything the rail dropped is behind it. The rail\'s WIDTH stays a constant at every rung, which is what discharges the R128 fit-zoom gate by argument.',
  'OPERATOR_REQUESTS.md O123, last paragraph · NOT STARTED — the dock first, by that row\'s own sequencing note'],

 ['ruled','· The rail\'s precondition is met, and it was not met a week ago',
  '<code>SHELL_LAYOUT_PROPOSAL.md</code> §5 made one thing a condition of scheduling the rail: the dock\'s rect channel published <em>layout</em> rather than <em>visibility</em>, so no driven check could tell a working rail from the 2026-08-10 defect in which three panels shipped unreachable with every gate green — and that defect <em>was this feature</em>. The channel was converted on 2026-09-04. The condition is discharged.',
  '§1.6, §5, §6 · precondition met 2026-09-04'],

 ['noted','⚠ The lasso is drawn with <em>borrowed</em> art, and there is no other honest option',
  'You named the lasso yourself and it does not exist — no command, no asset. The rail entry is drawn with <code>shape-ink</code>, the freehand pen\'s own picture, and outlined in the same dashed notice colour every other unbuilt control on this page wears. <em>Inventing a lasso drawing here would put a picture in the mock that the build has no way to render</em>, which is the exact failure this artifact exists to not repeat. When the tool is built it needs art of its own; until then the borrowing is stated rather than pretty.',
  'no `lasso` key in icons/assets · borrowed shape-ink'],

 ['noted','A command with no icon cannot live in an icon rail — and <s>two</s> ONE of yours has none',
  '<b>Corrected 2026-09-05, and the correction is the interesting half.</b> This line used to name <code>Select all</code> and <code>Actual size</code> together and say both proposed glyphs were "deliberately not adopted". <code>Select all</code> now HAS art — <code>select-all.svg</code>, drawn 2026-09-04 — because the word <em>deliberately</em> was doing work nobody had authorised: a build session refused the glyph, the refusal was quoted, and the quotation was quoted until it read as your ruling. It was not yours. You said so: <em>"add a select-all glyph. I didn\'t refuse that."</em> So the rail argument this line made against it has <b>expired</b>, and putting <code>Select all</code> on the strip is now a layout decision like any other rather than a decision to draw art first. <code>Actual size</code> is unaffected and stays out: its refusal is a reasoned argument about the <em>picture</em> — a numeral read at a glance beats any glyph substitute, and both add a decode step a bare percentage does not need — which no amount of drawing answers.',
  'his ruling 2026-09-04 · select-all.svg ships'],

 ['noted','The rail\'s tool groups are mode-gated, the same way the ribbon\'s already are',
  '<b>Switch the mode to Read and watch two rail entries go.</b> <code>Points</code> edits the nodes of a path and Read cannot; the lasso picks page content and Read does not do that either. Drawing them there would be authoring controls sitting on a mode whose own dispatch refuses them — which is not hypothetical, it shipped once and was fixed on 2026-09-04. A rail is a permanent surface, so a control that is wrong for the mode is wrong on screen the whole time rather than for one click.',
  'the same gate View ▸ Navigate already applies to Points'],
 ['noted','The strip\'s sentences: two are verbatim, five are indicative',
  'Select\'s and Cloud\'s sentences are the shipped strings, character for character. The other five tools\' are written for this mock and marked here rather than in five tooltips nobody opens. The build\'s own rule is that where a mock disagrees with a sentence that has already been written and tested, <em>the sentence wins</em> — which is also why the strip joins name to sentence with an em dash rather than the middle dot an earlier draft of this mock used: a dot makes the name look like a third fragment instead of the subject of the line.',
  'text/tool.rs · text/toolstatus.rs'],

 /* ─────────────── everything else, unchanged in state ─────────────── */
 ['ruled','· What the extra 40 pt actually buys the object rows',
  'The review said our rows list far less than the mock\'s. Read against the source it is <em>backwards</em>: ours already compose paint style, colour hex, line width, node count, text preview, font name and size, image pixels — <em>and a trailing diagnostic note the mock has no equivalent for</em>. The impression came from horizontal clipping at 320 pt, not from missing content. At 360 each row also earns an icon column and an index column, and the text that is left still ellipsises rather than being cut.',
  'part 6 · landed 2026-09-04 · the harness re-baseline was the larger half'],
 ['proposed','· Strip the AAAAAA+ subset tag in the row only',
  'Kept in Properties. Two subsets of one face carry different tags, so stripping it in both makes two rows read identically while they name different font objects.',
  '§2.4 hazard 2'],
 ['noted','360 pt fits most rows, not all — and that is not a failure',
  'Our composed rows are longer than the mock\'s, on purpose: a fill colour, a stroke colour, a width, a node count and a diagnostic note is more than "Path · filled (even-odd) #FAEEDC" carries. 360 pt stops the <em>common</em> row being cut; it does not promise every row fits, and a width that did would be a dock nobody wants. ★ Which is why part 3 pairs the width with the ellipsis and the hover: the horizontal scrollbar went away because there is no longer a part of a row past the pane to reach — the row shortens itself and hands you the rest on hover instead.',

 ['proposed','· Show the stroke colour beside the fill',
  'A path that both fills and strokes shows only the fill today — the summary collapses the engine\'s fill/stroke pair into one <code>Option&lt;Rgb&gt;</code>. The data is already in hand at the call site. The mock did not ask for this; it collapses them the same way we do.',

 ['proposed','· Compress the Objects header into one line',

 ['ruled','· And the rail is <em>not</em> S6 — a distinction worth keeping straight',
  'It is the only arrangement in which all five left panels are simultaneously one click away: a 280 pt horizontal tab bar cannot hold five tabs, a tall vertical strip holds five entries with room to spare and now carries the selectors as well. <em>S6\'s rail is a different feature</em> — a collapsed-state substitute drawn <em>instead of</em> a hidden tree, leaving the tree\'s state untouched. This one replaces the dock\'s arrangement <em>while the dock is open</em>. VS Code\'s activity bar, not its collapsed sidebar.',
  'part 7 · not started'],
 ['ruled','· Part 5 is satisfied with or without the rail — flip the Left knob',
  'One stack of five tabs is one line in the mode defaults and was legal the day the two-pane cap was retired. It buys the height back and pays with an overflow chevron at 280 pt. The rail buys the same height and pays nothing, which is why part 7 is worth its week — but part 5 does not wait on part 7, and in the build today it did not.',
  'app/modes/defaults.rs · landed 2026-09-04'],

 ['shipped','<code>Open in Acrobat</code>, top right beside Read / Review / Edit — <em>and it is solid now</em>',
  'Where you asked for it. It is drawn <em>beside</em> the mode selector and not <em>inside</em> it: those three cells are a radio group and every one of them is a mode, so a fourth cell that opened another application would be a button pretending to be a state — and the one press in that control that does not toggle anything is the one your hand will not expect. ★ This line said "being built now, the dash should be solid by the time you next open this" — <em>and it is</em>: <code>file.open_in_acrobat</code> registers as of 2026-09-04, so the dashed outline came off in the same pass that drew O123. A built control drawn as unbuilt is the same defect as the reverse, one direction over. ⚠ The picture is a window with a title bar and a sheet going into it — nothing of Adobe\'s mark is in it, and nothing ever will be.',
  'catalog/file.rs:621 · the button is live'],
 ['shipped','<code>Copy as vector</code>, beside Cut / Copy / Paste on Edit — <em>and it is solid now</em>',
  'Copy today puts a <em>picture</em> of the selection on the clipboard; this puts the geometry, so what you paste into the next drawing is still editable line-work rather than an image of it. It sits in Clipboard rather than in File ▸ Export because it is a clipboard verb — chord-reachable, and its result is pasted, not saved. It takes a column of its own rather than a fourth row in Cut / Copy / Paste: that triad is the one place in the ribbon you reach by position without reading, and inserting into it would cost you that. ★ This row said <em>"not built · not scheduled · art drawn so the proposal has a face"</em> — <em>and the face got it built the next day.</em> <code>edit.copy_as_vector</code> registers as token 408 and draws icon-only. A built control drawn as unbuilt is the same defect as the reverse, one direction over, and it is the direction that gets a thing built twice.',
  'catalog/edit.rs · edit.copy_as_vector, token 408 · live'],
 ['shipped','<code>Encrypt…</code> and <code>Permissions…</code> — a <em>new</em> Security group on File, not a row in Edit ▸ Protect',
  'This was <b>O119</b> drawn, and <b>you answered it: <em>"yes add encryption and permissions"</em>.</b> Both buttons now exist — <code>file.encrypt</code> and <code>file.permissions</code>, tokens 126 and 127, both large, in exactly this position, and <code>shell::manifest::file</code> cites this drawing as its reason for putting them here. ★ This row and the group above it both said <em>"neither button exists — they are here so the question has a picture"</em> until 2026-09-05, which is the mock claiming a shipped feature is unbuilt. <em>The argument below persuaded, you ruled, and the build followed — which is what this artifact is for; it just needed telling.</em> <em>Why a new group, argued rather than assumed:</em> every other command on Edit is an undoable edit to what is on a page, and these two are not edits at all — each rewrites every byte of the file and hands you a different one, which is a <em>save</em>. Redaction, four groups away, removes marks from a page and can be undone until you apply it; putting them on one tab would tell you they are the same kind of act. And the position within File is your own framing of the question — "protect a drawing before you send it out" — so it sits immediately after the band that sends it out. ⚠ Three things you already said change the answer and would be on screen beside these: a permission setting is a <em>request</em> any program may ignore, protecting a signed drawing is refused outright, and changing permissions on a protected file needs the owner password.',
  'O119 answered · catalog/file.rs tokens 126 / 127 · a password box, a permission list, and a full-rewrite save'],

 ['noted','★ The written analysis recommended <em>against</em> part 1, and you overruled it. What it got right and what it got wrong.',
  '<code>SHELL_LAYOUT_PROPOSAL.md</code> §3 ranked the one-line tool strip fourth of four and said do not build it. Its objection was that the strip <em>deletes live controls</em> — the pen\'s font, size and colour, the measure options, the three scale switches — and orphans a disclosure slot that exists because a 47-word refusal sentence had nowhere else to go. <b>That was right about the cost and wrong about the remedy.</b> It took the panel\'s contents as fixed and asked only whether a 26 pt row could hold them; your first sentence dissolves the question, because a font size is not the tool panel\'s to hold in the first place. The controls are in Properties and the refusal sentence is at the top of its body, wrapped, verbatim. ⇒ Recorded here rather than quietly deleted from that file: <em>an overruled recommendation is more useful to the next reader than a gap where it used to be.</em> It is not being re-argued.',
  'SHELL_LAYOUT_PROPOSAL.md §3 · overruled by O123, and the record kept'],
 ['rejected','<code>Thin lines</code> removed from View ▸ Display',

  'GLYPH_ADOPTION.md'],
 ['shipped','<code>Select all</code> DRAWS ONE — this row used to say the opposite',
  '<b>Reversed 2026-09-05.</b> It read: <em>"both commands register without one and both proposed glyphs were deliberately not adopted. Drawing art there would invent a decision nobody made."</em> The last sentence had it exactly backwards — <em>refusing</em> to draw is what invented a decision nobody made. <code>edit.select_all</code> carries <code>select-all</code> (token 402) and the asset ships. <code>Actual size</code> alone still draws none, and for a reason that survives scrutiny rather than a supply excuse: the icon ui-spec §3.2 argues against iconifying it <em>by name</em>. ⇒ A refusal that has been quoted three times is still a refusal by whoever made it first; verify it at source, not against the document that repeats it.',

 ['rejected','No Help button, no first-page / last-page buttons',
  'There is no Help command, no help dialog and no documentation target in the build; and there is no on-screen first- or last-page control — the status bar\'s page group is <code>⏴ n / N ⏵</code> and nothing else. R9: an unavailable capability renders nothing.',
  'GLYPH_ADOPTION.md'],

 ['shipped','Rulers on two edges with a corner box — <em>already built</em>',
  'Proposal 4 is not a proposal. 1,413 lines ship a top gutter, a left gutter and an explicit corner rect (held as a rect so the two rulers cannot draw the same tick twice at two alphas). R128-correct: the thickness is a constant and a test asserts the gutters are a constant bite out of the viewport. Labels come from the dimension engine, so a ruler reading and a placed dimension agree <em>to the digit</em>. <em>They ship OFF</em>, by a recorded decision — 44 pt off every canvas for every operator. Recommend leaving that; changing one boolean prices as a suite-wide harness re-baseline.',

 ['shipped','Objects → Properties is already a real master–detail',

 ['shipped','Per-mode dock width, already persisted',

 ['shipped','<code>Export image…</code> is on File ▸ Export, with art of its own',
  'The command shipped this morning (O120) and spent six hours wearing the generic <code>export</code> tray, alongside Export DXF and Export form data. That share was defended and it was wrong for this one control: a DXF and a form-data file have no picture to draw, a raster image does, and <em>this set already draws it</em> — Insert image wears the framed tile with a horizon, so you have already learned what that picture means here. Same tile, arrow pointing out instead of in. The other two exports keep the tray, correctly.',

 ['shipped','36 of the review\'s 65 glyphs adopted, 2026-09-04',

 ['shipped','A selected chrome control is accent ink on an <em>opaque</em> plate',
  'Not white on a translucent wash — that was the D2 defect. The plates are measured per preset and derived, not picked: Quiet <code>#A9BEDF</code>, Airy <code>#B9CEED</code>, Dark <code>#0B1726</code>, with <code>accent</code> as the ink. Cycle the preset knob; every selected tab, row, toggle and rail entry moves together.',

 ['shipped','A locked layer row carries a muted padlock',
  'Drawn only where <code>/Locked</code> is true — a column of open padlocks would be noise the eye must filter — and in muted ink rather than the accent, because <code>/Locked</code> is the producer\'s recorded intent, not a state of the application. It never appears on a signature row: this product performs no cryptographic verification and a padlock there would read as "verified".',

 ['noted','The three glyphs in <em>neither</em> adoption list now have art — closed',
  '<code>properties</code>, <code>insert-pages</code> and <code>set-scale</code> were live icon <em>keys</em> wearing another role\'s picture, and were in neither list — 36 adopted + 26 deferred accounts for 62 of the 65 delivered. This mock is what found them, by drawing shipped art beside proposed art until the count did not add up. All three were drawn later the same day; the generator\'s alias table is now <em>empty</em>, and the two orphaned pictures were kept as variants so they stay under test rather than rotting unused.',
  'icons/catalog/mapping.rs · closed 2026-09-04'],
 ['noted','★ Five new pictures are in the build; three of the five buttons are not',
  'Worth saying plainly, because it is the one way this mock could mislead you. A glyph shipping is <em>not</em> a command shipping. <code>export-image</code> and <code>open-in-acrobat</code> are on live buttons today. <code>copy-as-vector</code>, <code>encrypt</code> and <code>permissions</code> are drawings with nothing behind them yet — every one of them is dashed here, and each has its own line above. The art was drawn first on purpose: the icon set is tested as a whole, so a picture that exists is a picture the suite checks for legibility and for not colliding with its neighbours, and one that waits in a folder is not. It also means the question can be asked with a picture instead of a paragraph.',

 ['noted','<code>save.svg</code> is now the odd member of its own family',

const CHIP = {shipped:'shipped', ruled:'ruled · O123', proposed:'proposed', rejected:'rejected', noted:'noted'};
function renderLegend(){
  const el = $('#legend');
  el.hidden = !state.legend;
  if (!state.legend) return;
  const n = s => LEGEND.filter(x=>x[0]===s).length;
  el.innerHTML = `<h2>What this mockup draws, and what state each part is in <span style="font-weight:400;font-size:11px;color:#7E838C">— ${LEGEND.length} lines, scroll for all of them</span></h2>
    <div class="verdict">
      <span class="v ruled"><b>${n('ruled')}</b> ruled · O123</span>
      <span class="v shipped"><b>${n('shipped')}</b> shipped</span>
      <span class="v proposed"><b>${n('proposed')}</b> proposed</span>
      <span class="v rejected"><b>${n('rejected')}</b> rejected</span>
      <span class="v noted"><b>${n('noted')}</b> noted</span>
      <span class="rank">This is <b>your ruling drawn</b>, not four options ranked. Parts <b>1–6</b> — the one-line tool status, its controls in Properties, master–detail in the Tool panel's room, one left dock, 360 pt in Edit — <b>landed in the tree on 2026-09-04</b>. Part <b>7</b>, the rail carrying the navigate selectors and the selection tools, is <b>not started</b>: the dock first, by O123's own sequencing note, because the two share the dock layout and one pass would mean two large changes in one file with no green state between them.</span>
    </div>
    <div class="sub">Redrawn against the shipped source after <code>OPERATOR_REQUESTS.md</code> <b>O123</b> settled the layout. <b>Five states, and telling them apart is the whole point:</b>
      <b style="color:#C8A6FF">ruled</b> is the operator's own decision — not a proposal to weigh and <em>not automatically a build</em>, so every ruled line's mono reference row says where the code actually stands;
      <b style="color:#7FD79A">shipped</b> is in the build and was never in question;
      <b style="color:#7FB6FF">proposed</b> is nobody's decision yet, and carries its cost;
      <b style="color:#FF9C9C">rejected</b> was analysed and refused, and carries the reason;
      <b style="color:#E0BE7C">noted</b> is none of those, but you should see it.
      ★ <em>A ruled item is deliberately not promoted to</em> shipped <em>and not demoted to</em> proposed: one would have this artifact claim work that is not finished, the other would re-open a question you have closed. References are sections of <code>SHELL_LAYOUT_PROPOSAL.md</code> unless named otherwise.</div>
    <div class="lgrid">${LEGEND.map(([s,t,w,r])=>
      `<div class="li ${s}"><div class="chip">${CHIP[s]}</div><div><div class="t">${t}</div><div class="w">${w}</div><div class="r">${r}</div></div></div>`).join('')}</div>`;
}

/* ---------- the mock's own control bar ---------- */
function renderMockbar(){
  const seg = (label, key, opts) => `<span class="lbl">${label}</span><span class="seg">` +
    opts.map(([v,t,title])=>`<button data-set="${key}" data-val="${v}" aria-pressed="${String(state[key])===String(v)}" title="${title||''}">${t}</button>`).join('') + `</span>`;
  const tg = (id, label, on, title) => `<button class="tg" data-tg="${id}" aria-pressed="${on}" title="${title||''}">${label}</button>`;
  /* The three knobs the `before O123` setting overrides are dimmed rather than
     removed: a control that vanishes tells the operator it was never there. */
  const dim = state.layout==='today'
    ? 'class="wrap" style="opacity:.35" title="The arrangement before O123 had no rail and one dock width — this knob does nothing on that setting."'
    : 'class="wrap"';
  $('#mockbar').innerHTML =
      `<span class="lbl" style="color:#4C9AFF;font-weight:700">mock controls</span>`
    /* ★★ THE COMPARISON KNOB, first on the bar and first for a reason: this
       artifact is being read to CHECK a decision, and a decision is only
       visible against what it replaced. */
    + seg('layout','layout',[
        ['a7','A7 · as ruled','O123: one-line tool status, its controls in Properties, master–detail in the Tool panel\'s room, one left dock, 360 pt'],
        ['today','before O123','What was on screen before: a Tool panel taking a third of the dock, three right stacks, two left docks with a fixed split, 320 pt, rows cut mid-character']])
    + seg('preset','board',[['quiet','Quiet'],['airy','Airy'],['dark','Dark']])
    + `<span ${dim}>` + seg('left','left',[['rail','Rail','Panel tabs, the navigate selectors and the selection tools on one strip'],['tabs','5 tabs','Part 5 without the rail: one stack, five tabs, an overflow chevron at 280 pt']]) + `</span>`
    + `<span ${dim}>` + seg('rail room','railRoom',[
        ['roomy','Roomy','Everything, with its word under it'],
        ['tight','Tight','The words go first — every control still one click away'],
        ['snug','Snug','The selection group folds into the chevron'],
        ['cramped','Cramped','The navigate group folds too, except the armed one. The panel tabs never fold.']]) + `</span>`
    + `<span ${dim}>` + seg('dock','dock',[['320','320','What Edit had before O123 — and what Read and Review still get'],['360','360 · Edit','O123 part 6. Switch to Read to see the width remembered per mode.']]) + `</span>`
    + seg('armed','tool',[
        ['select','Select','The resting state. Brings the three resize switches.'],
        ['addtext','Add text','Brings the pen — face, size, colour.'],
        ['radius','Radius','Brings the removable pick list (O107).'],
        ['cloud','Cloud','Brings nothing, and says so. Most tools have no settings.']])
    + tg('selection','Selected', state.selection)
    + tg('rulers','Rulers', state.rulers, 'Shipped since long before this review — and shipping OFF by a recorded decision')
    + tg('labels','Button labels', state.labels)
    + `<span class="push"></span>`
    + `<button class="tg" data-tg="sheet">Glyph sheet</button>`
    + tg('legend','What changed ▾', state.legend);
}

/* ---------- glyph sheet ---------- */
function renderGlyphSheet(q=''){
  const list = GLYPHS.filter(x=>x.name.includes(q));
  $('#sheetgrid').innerHTML = list.map(x=>{
    const sym = x.sym || ('g-'+x.name);
    const cls = x.origin==='proposed' ? 'proposed' : (x.alias ? 'alias' : 'shipped');
    const or = x.origin==='proposed'
      ? (x.shadowed ? `proposed · the key already draws ${x.shadowed}` : `not adopted · ${x.verdict}`)
      : (x.alias ? `alias → ${x.src}` : 'in the app today');
    const why = x.origin==='proposed' ? `<div class="wy">${x.why}</div>` : '';
    return `<div class="cell ${cls}"><svg class="g"><use href="#${sym}"/></svg><svg class="g s"><use href="#${sym}"/></svg><div class="nm">${x.name}</div><div class="or">${or}</div>${why}</div>`;
  }).join('');
  const prop = GLYPHS.filter(x=>x.origin==='proposed').length;
  const alias = GLYPHS.filter(x=>x.alias).length;
  $('#sheetsum').innerHTML = `${GLYPHS.length} keys · <b>${GLYPHS.length-prop} draw art the product ships today</b>, read straight out of <code>icons/assets</code> at build time — ${alias} of them are aliases onto another key's asset. ${prop} were proposed by the review and <b>not adopted</b>; each says why. <code>thin-lines</code> is absent on purpose: art for a command deleted six weeks ago. Each key is shown at 30 px and at the 16 px it ships at.`;
}

/* ---------- wiring ---------- */
function renderAll(){
  app.dataset.mode = state.mode;
  app.dataset.board = state.board;
  app.dataset.layout = state.layout;
  app.dataset.railroom = state.railRoom;
  app.dataset.left = effLeft();
  /* ★ Part 6's "remembered per mode" made visible rather than described: the
     360 pt default belongs to Edit, and Read and Review keep 320. The knob
     only moves Edit's, which is exactly what a per-mode default means. */
  app.dataset.dock = effDock();
  app.dataset.labels = state.labels ? 'on' : 'off';
  app.dataset.rulers = state.rulers ? 'on' : 'off';
  /* ★ The mode selector and the window title are rendered FROM state, not
     toggled by the click that changed it. They were toggled in place, which
     worked for every click and was wrong for every URL fragment: `#read`
     moved the layout and left `Edit` pressed in the segmented control and in
     the title bar — a screenshot of a build that cannot exist. Anything a
     fragment can set has to be drawn from state. */
  const MODE = {read:'Read', review:'Review', edit:'Edit'};
  document.querySelectorAll('.modes button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.mode===state.mode)));
  $('#wintitle').innerHTML = `<b>a1-titleblock.pdf</b> — pdfcer — ${MODE[state.mode]}`;
  renderTabs(); renderLeft(); renderSheet(); renderDock(); renderStatus();
  renderMockbar(); renderLegend();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if (t.dataset.set){ state[t.dataset.set] = t.dataset.val; renderAll(); return; }
  if (t.dataset.tg){
    const k = t.dataset.tg;
    if (k==='sheet'){ $('#sheetov').hidden=false; renderGlyphSheet($('#sheetq').value.trim().toLowerCase()); return; }
    state[k] = !state[k]; renderAll(); return;
  }
  if (t.dataset.mode){ state.mode=t.dataset.mode; renderAll(); return; }
  if (t.dataset.tab){ state.tab=t.dataset.tab; renderTabs(); return; }
  if (t.dataset.panel){ state.leftPanel=t.dataset.panel; renderLeft(); return; }
  /* A rail entry that arms a tool moves the same state the ribbon does — which
     is the point of putting the selectors there, and is also why there is one
     TOOLS table rather than a rail copy and a ribbon copy. */
  if (t.dataset.arm){ state.tool=t.dataset.arm; renderAll(); return; }
  if (t.dataset.act==='rulers'){ state.rulers=!state.rulers; renderAll(); return; }
  if (t.classList.contains('rb') && t.dataset.glyph){
    const glyph=t.dataset.glyph;
    if (ARMS[glyph] && !t.disabled){ state.tool = ARMS[glyph]; renderAll(); return; }
    if (glyph.startsWith('page-')){
      state.pageDisplay = {'page-single':'single','page-continuous':'scroll','page-facing':'facing','page-facing-continuous':'facingscroll'}[glyph];
      state.facing = state.pageDisplay.startsWith('facing'); renderAll(); return;
    }
    if (t.hasAttribute('aria-pressed') && !t.disabled){
      const isRadio = /^(pointer|show-points|text-select|hand|shape-|ruler|measure-)/.test(glyph);
      if (isRadio){
        t.closest('.grp').querySelectorAll('.rb[aria-pressed]').forEach(b=>{
          if(/^(pointer|show-points|text-select|hand|shape-|ruler|measure-)/.test(b.dataset.glyph||'')) b.setAttribute('aria-pressed','false');
        });
        t.setAttribute('aria-pressed','true');
      } else t.setAttribute('aria-pressed', t.getAttribute('aria-pressed')!=='true');
    }
    return;
  }
  if (t.id==='kWheel'){ state.wheelFlip=!state.wheelFlip; renderStatus(); return; }
  if (t.id==='kSheetClose'){ $('#sheetov').hidden=true; return; }
});
$('#sheetq').addEventListener('input', e=>renderGlyphSheet(e.target.value.trim().toLowerCase()));
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#sheetov').hidden) $('#sheetov').hidden=true; });

/* A URL fragment forces state, so a headless capture can reach every
   combination without editing a default and re-shooting:
     …/pdfcer-shell.html#dark,dock360,tabs,tool-addtext,nolegend
   Tokens: quiet|airy|dark · rail|tabs · dock320|dock360 · a7|today ·
           rail-roomy|rail-tight|rail-snug|rail-cramped ·
           tool-select|tool-points|tool-text|tool-hand|tool-addtext|
           tool-radius|tool-cloud (and `armed`, kept as an alias for
           tool-cloud so older capture scripts still mean something) ·
           norulers · nosel · nolegend · read|review · sheet · tab-<id>

   ★ `tab-<id>` (tab-file, tab-edit, tab-pages, …) was added 2026-09-04, when
   three commands landed on tabs the mock does not open with and there was no
   way to photograph them without editing `state.tab` and putting it back. That
   edit-and-revert is precisely what this whole fragment mechanism exists to
   avoid, and the one time it is skipped is the time the default is left
   changed. It is PREFIXED rather than bare because `edit` is already a MODE
   token — a bare `edit` would have silently meant one of the two. */
for (const tok of (location.hash||'').replace('#','').split(',').filter(Boolean)){
  if (['quiet','airy','dark'].includes(tok)) state.board = tok;
  else if (['rail','tabs'].includes(tok)) state.left = tok;
  else if (tok==='dock320') state.dock='320';
  else if (tok==='dock360') state.dock='360';
  else if (tok==='armed') state.tool = 'cloud';
  else if (tok.startsWith('tool-')) state.tool = tok.slice(5);
  else if (tok==='today') state.layout = 'today';
  else if (tok==='a7') state.layout = 'a7';
  else if (tok.startsWith('rail-')) state.railRoom = tok.slice(5);
  else if (tok==='norulers') state.rulers = false;
  else if (tok==='nosel') state.selection = false;
  else if (tok==='nolegend') state.legend = false;
  else if (tok.startsWith('tab-')) state.tab = tok.slice(4);
  else if (['read','review','edit'].includes(tok)) state.mode = tok;
  else if (tok==='sheet') queueMicrotask(()=>{ $('#sheetov').hidden=false; renderGlyphSheet(); });
}

renderAll();
</script>
