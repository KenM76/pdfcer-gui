# ui-verify — the harness that drives the built binary.
#
# WHY THIS IS A WORKSPACE MEMBER AND NOT A SCRIPT
# ===============================================
# The predecessors (D:\Dev\pdfcer\tools\gui-drive.ps1, gui-shot.ps1) are
# PowerShell, and they earned their keep — most of what this crate knows was
# learned by them. But they top out where this project starts: they can drive
# and photograph, and they cannot ASSERT. Every verdict they produce is a human
# reading a trace or squinting at a PNG, which is exactly the step that did not
# happen for D1 and D2.
#
# A compiled crate gets three things a script cannot: a pixel oracle that is a
# tested function rather than an eyeball, a coordinate seam the type system
# enforces (see src/coords.rs), and a check suite that returns an exit code CI
# can read.
#
# DEPENDENCIES
# ============
# Exactly one, and it is already in D:\Dev\pdfcer's Cargo.lock at this version.
# The workspace root warns that a dependency this workspace adds which is NOT
# already in pdfcer's lockfile is an operator decision; `windows-sys 0.61` is in
# it (pulled in transitively by winit/eframe), so this adds nothing new to the
# dependency posture.
#
# Everything else is hand-rolled on purpose:
#   * the PNG writer (src/png.rs)   — ~120 lines using stored deflate blocks,
#                                     versus pulling in png + a compressor;
#   * the error type (src/error.rs) — ~40 lines, versus thiserror;
#   * the argument parser (main.rs) — ~80 lines, versus clap.
# A verification harness with a large dependency tree is a harness that fails
# to build for reasons unrelated to the thing under test, on the day it is most
# needed.
[package]
name = "ui-verify"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Drives the built pdfcer GUI through the OS and asserts on its diagnostic trace and its pixels."

[lib]
name = "ui_verify"
path = "src/lib.rs"

[[bin]]
name = "ui-verify"
path = "src/main.rs"

# Target-gated so `cargo check` on a non-Windows machine still resolves. The
# crate itself compiles everywhere — src/sys/unsupported.rs supplies the same
# API returning a clear "this platform cannot drive a window" error — because a
# harness that breaks the workspace build on a developer's Linux box is a
# harness that gets removed from the members list.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # ★ Added 2026-08-21 for the clipboard oracle (defect O18). FEATURES of a
    # dependency already present and already linked - not a new dependency, so
    # the posture the header describes is unchanged.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
