<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- Move to other window: two windows, each with a title bar, and an arrow
       from the left one into the right one. Primitives only.

       Distinct from window-new.svg, which has one window and an arrow leaving
       it for nowhere in particular: here the destination is drawn, because
       the command's destination already exists. -->
