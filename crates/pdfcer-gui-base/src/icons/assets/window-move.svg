  <path d="M3 16h17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="28" y="16" width="17" height="22" rx="2" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 22h17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 26h26M30 20l6 6l-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
