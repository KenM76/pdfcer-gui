<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- Generic page-out shape — generic, no trademark risk -->
  <!-- ui-spec §3.1 "save", closing paragraph, reserves the download direction for
       "a future Export-data/Extract-pages action". This is the Extract-pages half of
       that reservation; download.svg is the Export-data half.

       A page with an arrow leaving it downward. Extract takes pages OUT of this
       document and writes them to a new file, so it belongs to the same in/out
       family as upload.svg (insert pages) and download.svg (export) — the arrow
       direction is the family's grammar and this one points out.

       The PAGE is what separates it from download.svg's tray. Both say "out"; this
       one says what is going out, which matters because the two live on different
       tabs (Pages and File) and an operator who learned one must not misread the
       other as the same command in a new place. -->
  <rect x="15" y="4" width="18" height="22" rx="2" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M24 29v12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M18 35l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
