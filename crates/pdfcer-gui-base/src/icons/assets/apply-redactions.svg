<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- Generic solid bar with an accept tick — generic, no trademark risk -->
  <!-- Edit ▸ Apply redactions (`edit.redact_apply`) — the one irreversible
       command in the redaction family. Until now it borrowed `redact` from
       `edit.redact`, which meant the button that ARMS a marking tool and the
       button that PERMANENTLY DESTROYS content were the same picture, on the
       same tab, two rows apart. That is the most expensive icon collision in
       this set: the cost of pressing the wrong one is not a wasted click, it is
       content that cannot be recovered.

       What it depicts: a redaction bar with a tick struck against it — the mark
       is no longer a proposal, it has been carried out.

       ★ The neighbours it must not be confused with are its own two siblings.
       Against redact.svg (arm the tool): that one wraps its bar in a solid page
       frame with two text rules, i.e. "a mark ON a page"; this one has NO frame
       at all, because applying is not done to a mark on a page, it is done to
       the whole document, so the bar floats free. That absence is the cue —
       adding a frame later would destroy the distinction. Against
       redact-selection.svg (mark what is selected): that one's second element
       is a dashed enclosure, this one's is a tick, and tick-versus-enclosure is
       the strongest pairwise difference available at 16 px.

       ★ The tick is the same figure as finish-shape.svg's (`M28 34l4 4 8-8`
       there, `M30 30l4 4 8-9` here) and that is intended: a tick means "this
       gesture is now committed" in both places. They never share a band — one
       is Edit ▸ Redact, the other Markup ▸ Shapes — and the mark each one
       accompanies differs completely (a solid bar versus an open vertex run),
       so the shared vocabulary reads as consistency rather than as a duplicate.

       ★★ REPORTED, NOT FIXED — the bar is fill="currentColor", and both
       `assets` §3 and `Icon::Redact` state redaction is the set's ONE filled
       glyph. See redact-selection.svg for the full note: the test both cite
       does not exist, and three shipped assets are already filled. One operator
       decision covers both files and must be taken once, for the family. -->
  <path d="M30 30l4 4 8-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="6" y="20" width="22" height="8" rx="1" fill="currentColor" stroke="none"/>
</svg>
