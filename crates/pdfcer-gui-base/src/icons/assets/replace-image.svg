<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- Replace image (`format.replace_image`) — a PICTURE TILE in the upper
       left with a circling arrow over its lower-right corner: this picture,
       exchanged for another. The tile and horizon are `export-image.svg`'s
       noun, so the subject reads as a raster picture; the cue that separates
       the two is the arrow's shape — a loop that returns where it began, where
       export's leaves in a straight line. -->
  <rect x="5" y="5" width="24" height="20" rx="2" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M8 21l6-7 4 4 3-3 5 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 35a8 8 0 1 1-8-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 23l4 4-4 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
