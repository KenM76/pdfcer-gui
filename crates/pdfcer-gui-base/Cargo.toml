# pdfcer-gui-base — the floor of the pdfcer-gui crate stack.
#
# WHAT GOES IN HERE, and it is a narrow test: a module that references no other
# module of `pdfcer-gui`. Nothing else. `tools/module-graph.py` prints the set;
# when it grows, this crate may grow with it.
#
# WHY IT EXISTS, and it is NOT build time. Moving these four modules out is
# ~3,000 lines of 422,000 and buys no measurable seconds. It buys an arrow the
# compiler defends. `pdfcer-gui` was one crate, a crate is Rust's only enforced
# boundary, and with no boundary inside it the modules grew 25 mutually
# recursive pairs — `app` <-> `canvas` at 263 references one way and 273 the
# other. Cargo forbids a cycle between crates, so every one of those pairs now
# has to be cut by hand before the crate can be divided where it would actually
# pay. This crate is the first cut, and from here downward that cannot recur:
# a module in here CANNOT call up into the application, because the code does
# not compile if it tries.
#
# See `DESIGNS.md`, "The GUI is one crate, and its five largest modules call
# each other in both directions", for the staged plan this is stage 1 of.
#
# THE ATTRIBUTION FILE HAS TO BE REGENERATED. No dependency below is new to
# the build — both are already linked into `pdfcer-gui` — but a workspace
# member is itself a crate `cargo-about` enumerates, so THIS crate is a new
# line in `THIRD_PARTY_LICENSES.md`. Splitting a crate is therefore not a
# licence-neutral act on that file, and `check-third-party-licences.sh` is
# what says so.
[package]
name = "pdfcer-gui-base"
description = "Floor of the pdfcer-gui crate stack: the modules that reference nothing above them."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# egui — `diag` types its rect and control reports as `egui::Rect` and
# `egui::Response` rather than as tuples, so a caller hands over what it
# already has and `ui-verify` parses egui's own `Debug` spelling. Pinned once
# in `[workspace.dependencies]`, like every other toolkit dependency here.
egui.workspace = true

# egui-shell: the ribbon icon request and theme accents the icon painter answers.
egui-shell.workspace = true

# native-gl: the GL error record the upload ledger attributes.
native-gl = { path = "../native-gl" }

# native-clipboard: `clipboard::place` puts the ordered formats on the clipboard.
native-clipboard = { path = "../native-clipboard" }

# native-window: `dialoghost` makes each dialog an OWNED OS window.
native-window = { path = "../native-window" }

# flate2 — `tableexport::ods` deflates the spreadsheet's parts, and `ocr`'s
# test fixtures `/FlateDecode` their scanned image. The engine's own spec, so
# the lockfile holds one flate2.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# pdfcer-core — `units` converts against `pdfcer_core::dimension::Unit`, which
# is what makes the GUI's unit table and the engine's agree by construction
# rather than by a duplicated 25.4. Declared with the SAME git/branch/feature
# spec as `crates/pdfcer-gui/Cargo.toml` so cargo unifies them into one build
# of one crate; a divergence here would silently compile the engine twice.
pdfcer-core = { git = "file:///D:/Dev/pdfcer", branch = "main", default-features = false }

# pdfcer-fetch = the engine's network crate: `sign::timestamp` asks an RFC 3161
# server and `ocr::fetch` downloads pinned model files. Optional behind
# `timestamp` and `model-download`, so a build with neither has no network code
# (pdfcer-core and pdfcer-render never do).
pdfcer-fetch = { git = "file:///D:/Dev/pdfcer", branch = "main", default-features = false, optional = true }

# pdfcer-render — `ocr` rasterises a page to show the recogniser. Same spec as
# `pdfcer-gui`'s, for the unification reason given above.
pdfcer-render = { git = "file:///D:/Dev/pdfcer", branch = "main", default-features = false }

# pdfcer-ocr-host — runs a discovered OCR model of any kind, including a
# program add-on (Tesseract) run as a separate process, which pdfcer-core
# never does. Same spec as the engine crates above, for unification; its
# recogniser features forward the same names below.
pdfcer-ocr-host = { git = "file:///D:/Dev/pdfcer", branch = "main", default-features = false }

# Poster tiling (`poster`): the engine lays the tiles out, this crate adds the
# band for marks and labels and draws them.
pdfcer-print = { git = "file:///D:/Dev/pdfcer", branch = "main" }

[dev-dependencies]
# `redact::sealed` reads Rust source as a syntax tree; see pdfcer-gui's entry.
syn = { version = "2.0.119", features = ["full", "visit"] }

[features]
# `ocrs` — the recogniser. `pdfcer-gui` takes this crate with
# `default-features = false` and forwards its own `ocrs`, which documents what
# the flag gates; it is a default here only so this crate builds and tests
# alone as the program ships.
default = ["ocrs", "ocrcer", "paddle", "ocr-vl", "svg-import"]
ocrs = ["pdfcer-core/ocrs", "pdfcer-ocr-host/ocrs"]
# `svg-import` — reading an SVG as a vector drawing (`picture::Picture::Svg`).
svg-import = ["pdfcer-core/svg-import"]
# `ocrcer` — the second recogniser, `pdfcer_core::ocr::engine_ocrcer`, whose
# `ocrcer-core` the engine vendors from OCRcer's newest local commit. Offered
# beside `ocrs`, never instead of it.
ocrcer = ["pdfcer-core/ocrcer", "pdfcer-ocr-host/ocrcer"]

# `paddle` — the third recogniser, `pdfcer_core::ocr::engine_paddle`
# (PaddleOCR PP-OCR exports run through `rten`, which `ocrs` already links).
# The package ships PP-OCRv5 det.onnx, a Latin rec.onnx and its dict.txt in
# `models/paddle`; an operator may replace rec.onnx and dict.txt for another language.
paddle = ["pdfcer-core/paddle", "pdfcer-ocr-host/paddle"]
# `ocr-vl` — PaddleOCR-VL, whose weights are an add-on folder.
ocr-vl = ["pdfcer-core/ocr-vl", "pdfcer-ocr-host/ocr-vl"]
# The private-key side; `pdfcer-gui` forwards its own `signing` here. Not a
# default: base carries no capability the top crate did not ask for.
signing = ["pdfcer-core/signing"]
# PAdES B-T: signing plus an RFC 3161 timestamp over the network.
timestamp = ["signing", "dep:pdfcer-fetch", "pdfcer-fetch/download"]
# Downloading the engine's pinned OCR model files (`ocr::fetch`).
model-download = ["dep:pdfcer-fetch", "pdfcer-fetch/download"]
# `test-fixtures` — `opendoc::fixtures`, for `pdfcer-gui`'s tests. Its
# dev-dependency turns it on; the shipped program never does.
test-fixtures = []
