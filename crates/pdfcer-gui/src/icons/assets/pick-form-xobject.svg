<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- Selection filter, "Groups" row (O17) — engineer-authored in the same §1
       style contract as text-freetext.svg (see PROVENANCE.md, "spec gaps").
       Generic geometry, no trademark risk.

       The row it marks is FORM XOBJECTS: an entire nested drawing that the
       page treats as one opaque object. On a CAD sheet this is usually the
       title block or the border, and it is the single most common cause of the
       complaint "why is the selection box so big?" — one click, one object, a
       hundred visible marks.

       So the glyph has to say "a container that is itself one thing", and the
       construction is a frame with a MINIATURE DRAWING inside it: a stroke, a
       curve fragment and a small square. Deliberately three unlike marks — a
       drawing is heterogeneous, and three copies of the same mark would read as
       a list or as text lines.

       ★ Distinguishing it from text-freetext.svg, which is also "a rect with
       something in it", is entirely the job of those contents. That icon's
       interior is three EVENLY SPACED HORIZONTAL RULES of decreasing length,
       which is unmistakably prose. Nothing inside this frame is horizontal and
       nothing is repeated, which is unmistakably not.

       The frame's corner radius (rx=2) matches text-freetext.svg and
       shape-rect.svg rather than being softened, because it is a bounding box
       in the same family as theirs. -->
  <rect x="7" y="9" width="34" height="30" rx="2" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M13 32L20 21L25 27" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 32C32 32 31 22 36 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="27" y="14" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
