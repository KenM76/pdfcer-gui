<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- Copy the WHOLE DOCUMENT's text — three square-on sheets cascading down and
       left, only the topmost complete and carrying two short text rules.
       Primitives only; no trademark risk.

       Three sheets is "the whole file"; rules on the top one alone say the text
       is being taken FROM all of them, not typed onto one of them.

       ★ Like its sibling, this replaces a borrow, and here the borrow is the
       sharper problem: `file.copy_page_text` and `file.copy_document_text` are
       registered adjacent in ONE group, both `.with_icon("copy")`, so today two
       neighbouring controls that differ in scope are drawn by the same art and
       an operator can only tell them apart by reading. That is the state
       `catalog::file`'s convention exists to prevent.

       The neighbours, and the cues:

       * copy-page-text.svg — the pair is meant to be learned together, so it
         shares the vocabulary and differs only where the commands differ:
         COUNT and RULE LENGTH. Two sheets with three full-width rules = one
         page's text. Three sheets with two short rules = the file's.
       * pages.svg is also three square-on sheets, and omits text rules on
         purpose — that panel is about sheets as objects, not about what is
         printed on them. The rules are the whole difference and must survive.
       * layers.svg is three sheets too, but ISOMETRIC. `pages.svg` states the
         rule this follows: a layer is a plane you look through, so it is drawn
         from above; a page is a thing you look at, so it is drawn square-on.
       * copy.svg is two blank rects; blank and two, against ruled and three. -->
  <path d="M20 4h14l6 6v20H20z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M20 10h-6v24h20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 16H8v26h20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 12h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M26 18h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
