<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <!-- Attachments — a paperclip, the one metaphor every mail client, office suite
       and browser has used for a file carried alongside a document.
       Primitives only (two arcs and a straight run); no trademark risk.

       Deliberately NOT a page behind a page: that is copy.svg's vocabulary
       and would claim this command duplicates something. An attachment is a
       foreign file riding in the PDF, not a copy of anything in it. -->
  <path d="M31 15L19 27a4.5 4.5 0 0 0 6.4 6.4L38 20.8a8 8 0 0 0-11.3-11.3L13 23.2A11.5 11.5 0 0 0 29.3 39.5L39 29.8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
