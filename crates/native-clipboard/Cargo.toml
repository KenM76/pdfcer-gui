# `native-clipboard` — an ORDERED, ALL-OR-NOTHING clipboard transaction.
#
# WHY THIS IS ITS OWN CRATE, AND THE PRECEDENT IT IS BUILT ON
#
# `crates/native-window` is a whole crate for four `user32` calls, and its
# manifest states the reason in one sentence: `egui-shell` and `pdfcer-gui`
# both carry `#![forbid(unsafe_code)]`, that is a real claim rather than a lint
# preference, and `forbid` cannot be relaxed by an inner `allow` — deliberately.
#
# This crate exists for the identical reason one question further on.
# `pdfcer-gui` must place four clipboard formats in a measured order, and one
# of the four — `CF_ENHMETAFILE` — is a **GDI handle** rather than an
# `HGLOBAL`. There is no safe Rust route to `SetEnhMetaFileBits` followed by
# `SetClipboardData`, and the ownership contract between those two calls is the
# real content of the job: on success the clipboard OWNS the handle and freeing
# it afterwards is a double free; on failure it is still ours and NOT freeing
# it is a leak. That contract wants one file, read once, with the invariant
# written beside every call — not eleven `unsafe` blocks scattered through a
# 40-file application whose top-level claim would have to be downgraded from
# `forbid` to `deny` to admit them.
#
# ⇒ So the unsafe is QUARANTINED here, exactly as `native-window` quarantines
# the window-ownership unsafe: one Windows module, eleven declarations, one
# public function, no state, and no handle it does not free by scope.
#
# NO DEPENDENCIES, AND THAT IS A DECISION RATHER THAN AN ACCIDENT
#
# `clipboard-win` and `windows` are both already linked into `pdfcer-gui.exe`
# (measured with `cargo tree -i`, not read off a lockfile), so naming either
# would have been free of new code. They are not named, for `native-window`'s
# own stated reason: *"eleven symbols is not worth a dependency"*, and because
# `windows` 0.62's `SetClipboardData` wraps the handle in a typed newtype whose
# ownership rules this crate would then be describing at second hand. Every
# declaration in `src/win32.rs` is copied from the SDK signature and carries
# the invariant its call site upholds. That is the whole crate.
#
# A second consequence, and it is the one that shows up in a gate:
# `THIRD_PARTY_LICENSES.md` is generated by `cargo-about` from the SHIPPING
# dependency graph. A first-party workspace member with an empty
# `[dependencies]` block adds no row and no licence FAMILY to that document —
# so `tools/gates/check-third-party-licences.sh` is unaffected by this crate's
# existence. Adding `clipboard-win` or `windows` as direct dependencies would
# also have added no row (both are already in the shipping graph through
# `eframe` and `pdfcer-print`), but "would have been fine" is not the same
# claim as "cannot change", and this crate makes the stronger one.
#
# WHAT MUST NEVER GO IN HERE
#
# A PDF concept. This crate takes BYTES and FORMAT NAMES and places them; it
# does not know what an SVG is, why the SVG goes first, or that the caller is a
# document viewer. `native-window`'s manifest calls that property R7-clean and
# it is the property that would let `egui-shell` — a shell that must never
# learn what a document is — take this dependency unchanged. A `use
# pdfcer_core::…` anywhere under `src/` is the wrong shape, not a shortcut.
#
# Also never: a *policy* about which formats matter. The rule that a raster
# placed without a vector degrades a Word paste to a flat picture is a fact
# about Word and about the caller's intent, and it lives with the caller —
# `crates/pdfcer-gui/src/clipboard.rs`'s `degrades_word_to_a_picture`. This
# crate refuses an empty transaction and nothing else.
#
# DELETED, NOT PORTED. Same disposal as `native-window`: there is no trait and
# no second backend beyond a no-op for every non-Windows target, so if a
# toolkit ever grows an ordered multi-format clipboard API this crate is
# removed rather than extended.

[package]
name = "native-clipboard"
version = "0.1.0"
edition = "2024"
publish = false
description = "An ordered, all-or-nothing Windows clipboard transaction: bytes in, formats placed."
license = "MIT"

[dependencies]

[lints.rust]
missing_docs = "deny"
